<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PPL Log">
<meta name="theme-color" content="#000000" id="themeColor">
<title>PPL Log</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="chart.umd.js"></script>
<style>
:root{
  --bg:#000000; --surface:#111111; --sunk:#1C1C1E; --ink:#F2F2F2; --muted:#8A8A8E; --faint:#4A4A4E;
  --line:#222224; --accent:#FF453A; --ok:#32D74B; --okbg:rgba(50,215,75,.12);
  --push:#F2A3C2; --pull:#93C3F2; --legs:#9FDDBE; --cardio:#C7B5F4; --gold:#EBCB7A;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav:62px; --r:16px;
  color-scheme:dark;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
input,textarea,select{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 2px var(--accent)}
.wrap{max-width:540px;margin:0 auto;padding:10px 16px calc(var(--nav) + 24px + env(safe-area-inset-bottom,0px));overflow-x:clip}
body.mini-on .wrap{padding-bottom:calc(var(--nav) + 96px + env(safe-area-inset-bottom,0px))}
#main{will-change:transform,opacity}

.top{display:flex;justify-content:space-between;align-items:center;height:36px;margin-bottom:6px}
.top .sub{font-size:14px;color:var(--muted)}
.clock{font-family:var(--display);font-weight:600;font-size:17px;background:var(--surface);margin-left:auto;border-radius:999px;padding:4px 12px 4px 10px;display:flex;align-items:center;gap:7px}
.clock::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
.clock:empty{display:none}
@keyframes pulse{50%{opacity:.35}}

.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--surface);border-radius:14px;padding:4px;gap:2px;margin-bottom:20px}
.seg button{border:0;background:none;border-radius:10px;height:38px;font-size:15px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button i{width:7px;height:7px;border-radius:50%}
.seg{position:relative}
.seg button{position:relative;z-index:1;transition:color .2s}
.seg button[aria-selected="true"]{color:var(--ink);font-weight:600}
.segind{position:absolute;top:4px;bottom:4px;left:4px;border-radius:10px;background:var(--sunk);transition:transform .28s cubic-bezier(.2,.8,.2,1);z-index:0}
.seg.two{grid-template-columns:1fr 1fr;margin-bottom:14px;background:#000}
.seg.two button[aria-selected="true"]{background:var(--sunk)}
.sheetbox .seg button[aria-selected="true"]{background:var(--sunk)}

h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:1;margin:0}
.lede{color:var(--muted);font-size:15px;margin:6px 0 18px}

.card{background:var(--surface);border-radius:var(--r);padding:16px}
.stack>*+*{margin-top:10px}
.exname{font-weight:600;font-size:18px;margin:0;line-height:1.25}
.exmeta{font-size:14px;color:var(--muted);margin:2px 0 12px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--okbg);color:var(--ok)}
.setrow{display:grid;grid-template-columns:24px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.setno{font-size:14px;color:var(--faint);text-align:center;font-weight:600}
.field{position:relative;display:block}
.field input{width:100%;height:44px;border:0;background:var(--sunk);border-radius:12px;padding:0 40px 0 14px;font-family:var(--display);font-weight:600;font-size:21px;transition:background .15s}
.field input::placeholder{color:var(--faint)}
.field em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--muted);pointer-events:none}
.done .field input{background:var(--okbg)}
.check{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.exfoot{display:flex;gap:4px;margin:2px -8px -6px}
.ghost{background:none;border:0;color:var(--muted);font-size:14px;font-weight:500;padding:8px;border-radius:8px}
.ghost:active{background:var(--sunk)}

textarea{width:100%;border:0;background:var(--surface);border-radius:var(--r);padding:14px 16px;resize:vertical;min-height:70px}
.primary{width:100%;height:54px;border:0;border-radius:var(--r);background:var(--ink);color:#000;font-weight:600;font-size:17px}
.primary.accent{background:var(--accent);color:#fff}
.textlink{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:8px 0}
.center{text-align:center}

/* strength cards */
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.count{font-family:var(--display);font-weight:600;font-size:17px;color:var(--faint)}
.exdone .count{color:var(--ok)}
.sgrid{display:grid;grid-template-columns:26px 1fr 66px 66px 40px;gap:8px;align-items:center}
.shead{font-size:12px;font-weight:600;color:var(--faint);margin-bottom:6px}
.shead span:nth-child(n+3){text-align:center}
.srow{margin-bottom:6px;padding:3px 0;border-radius:12px;transition:background .15s}
.srow.done{background:var(--okbg)}
.srow .setno{font-family:var(--display);font-size:18px}
.prev{background:none;border:0;text-align:left;font-size:14px;color:var(--muted);padding:8px 0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.prev:disabled{color:var(--faint)}
.sin{width:100%;height:40px;border:0;background:var(--sunk);border-radius:10px;text-align:center;font-family:var(--display);font-weight:600;font-size:20px;padding:0 4px}
.srow.done .sin{background:transparent}
.sin::placeholder{color:var(--faint);font-weight:500}
.check2{width:40px;height:40px;border-radius:50%;border:2px solid var(--line);background:none;color:var(--faint);font-size:16px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.check2[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.addrow{width:100%;height:40px;border:0;border-radius:10px;background:var(--sunk);color:var(--muted);font-weight:600;font-size:14px;margin-top:4px}
.exfoot2{display:flex;gap:2px;margin:6px -8px -8px}
.wbar{position:sticky;top:calc(env(safe-area-inset-top,0px));z-index:2;margin:0 -16px 12px;padding:8px 16px;background:#000}
.wbar-in{display:flex;align-items:center;justify-content:space-between;gap:12px;background:var(--surface);border-radius:14px;padding:10px 10px 10px 14px}
.wbar-in span{font-size:15px;color:var(--muted)}
.wbar-in b{color:var(--ink);font-family:var(--display);font-size:20px}
.mini{height:36px;border:0;border-radius:10px;background:var(--ink);color:#000;font-weight:600;padding:0 16px}
.wprog{height:3px;border-radius:2px;background:var(--line);margin:8px 2px 0;overflow:hidden}
.wprog i{display:block;height:100%;background:var(--ok);transition:width .3s}
.tips{border:1px solid var(--line);background:transparent}
.tips ol{margin:8px 0 12px;padding-left:20px;font-size:15px}
.tips li{margin-bottom:6px}
.tips h3{margin:0;font-size:17px}
.swipehint{font-size:13px;color:var(--faint);text-align:center;margin:18px 0 0}
/* cardio */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--sunk);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:#000}
.big{font-family:var(--display);font-weight:700;font-size:76px;line-height:1;text-align:center;letter-spacing:.01em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.phase{text-align:center;font-size:15px;color:var(--muted);min-height:22px}
.phase.work{color:var(--accent);font-weight:600}
.bar{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin:14px 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lab{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.btnpair{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.secondary{height:54px;border:0;border-radius:var(--r);background:var(--sunk);font-weight:600;font-size:16px}

/* progress */
h2{font-family:var(--display);font-weight:700;font-size:46px;line-height:1;margin:0 0 18px}
h3.sec{font-size:15px;font-weight:600;color:var(--muted);margin:24px 2px 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05}
.stat span{font-size:13px;color:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.cell{aspect-ratio:1;border-radius:4px;background:var(--sunk)}
.cell.push{background:var(--push)} .cell.pull{background:var(--pull)} .cell.legs{background:var(--legs)} .cell.cardio{background:var(--cardio)}
.cell.both{box-shadow:inset 0 -4px 0 var(--cardio)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.chartbox{position:relative;height:210px}
select{width:100%;height:44px;border:0;background:var(--sunk);border-radius:12px;padding:0 12px;margin-bottom:12px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:10px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:15px}
.rows li+li{border-top:1px solid var(--line)}
.rows li span{color:var(--muted);text-align:right}

/* history */
.hhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.htitle{font-weight:600;font-size:18px;display:flex;align-items:center;gap:8px}
.htitle i{width:9px;height:9px;border-radius:50%}
.hdate{font-size:14px;color:var(--muted)}
.hnote{font-size:14px;color:var(--muted);margin:4px 0 2px}
.empty{background:var(--surface);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}

/* settings */
.setting{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0}
.setting+.setting,.setting+.chips,.chips+.setting{border-top:1px solid var(--line)}
.chips+.setting{margin-top:12px}
.setting p{margin:0}
.setting small{display:block;color:var(--muted);font-size:13px}
.switch{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.num{width:68px;height:40px;border:0;background:var(--sunk);border-radius:10px;text-align:center;font-family:var(--display);font-weight:600;font-size:20px}
.inp{width:100%;height:44px;border:0;background:var(--sunk);border-radius:12px;padding:0 12px;font-family:var(--display);font-weight:600;font-size:20px}
.plategrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:6px}
.plategrid label{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.btn{height:42px;border-radius:12px;border:0;background:var(--sunk);padding:0 16px;font-weight:600;font-size:15px}
.btn.danger{color:var(--accent)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:#000;transform:translateZ(0);padding-bottom:env(safe-area-inset-bottom,0px);z-index:3;box-shadow:0 -1px 0 var(--line)}
.tabsin{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav);position:relative}
.navind{position:absolute;top:0;left:0;width:25%;height:3px;display:flex;justify-content:center;transition:transform .3s cubic-bezier(.2,.8,.2,1)}
.navind::after{content:"";width:28px;height:3px;border-radius:0 0 3px 3px;background:var(--accent)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--faint)}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink)}

/* rest timer */
.timer{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 10px + env(safe-area-inset-bottom,0px));max-width:516px;margin:0 auto;background:var(--sunk);color:var(--ink);border:1px solid #2C2C2E;border-radius:18px;padding:12px 14px 10px;display:none;z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer.on{display:block}
.tin{display:flex;align-items:center;gap:6px}
.tclock{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;min-width:84px;font-variant-numeric:tabular-nums}
.tlabel{flex:1;font-size:14px;opacity:.7}
.tbtn{background:rgba(127,127,127,.22);border:0;color:inherit;border-radius:10px;height:34px;padding:0 10px;font-size:14px;font-weight:600}
.tprog{height:3px;background:rgba(127,127,127,.3);margin-top:10px;border-radius:2px;overflow:hidden}
.tprog i{display:block;height:100%;background:var(--accent);width:0}
.timer.over .tclock{color:var(--accent)}

/* accordion */
.ex{padding:0;overflow:hidden}
.exbtn{width:100%;border:0;background:none;text-align:left;padding:14px 16px;display:grid;grid-template-columns:1fr auto 20px;gap:4px 12px;align-items:center}
.exbtn .exname{grid-column:1}
.exbtn .exmeta{grid-column:1;margin:0}
.exbtn .count{grid-column:2;grid-row:1 / span 2}
.chev{grid-column:3;grid-row:1 / span 2;width:20px;height:20px;stroke:var(--muted);fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round;transition:transform .25s}
.ex.open .chev{transform:rotate(180deg)}
.exbody{display:grid;grid-template-rows:0fr;transition:grid-template-rows .28s cubic-bezier(.2,.8,.2,1)}
.ex.open .exbody{grid-template-rows:1fr}
.exbody>div{overflow:hidden;min-height:0}
.exinner{padding:2px 16px 14px}
.exdone .count::before{content:"✓ ";}
.stack.ex-list>*+*{margin-top:8px}
/* now-playing bar */
.np{position:fixed;left:10px;right:10px;bottom:calc(var(--nav) + 8px + env(safe-area-inset-bottom,0px));max-width:520px;margin:0 auto;background:var(--sunk);border:1px solid #2C2C2E;border-radius:16px;z-index:2;transform:translateY(calc(100% + 80px));transition:transform .32s cubic-bezier(.2,.8,.2,1);overflow:hidden;cursor:pointer}
.np.on{transform:translateZ(0)}
.np-in{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;min-height:58px}
.mdot{width:9px;height:9px;border-radius:50%;flex:none}
.mtext{flex:1;min-width:0;display:flex;flex-direction:column}
.mtext b{font-size:15px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtext span{font-size:13px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.mtime{font-family:var(--display);font-weight:700;font-size:26px;font-variant-numeric:tabular-nums}
.mtime.over{color:var(--ok)}
.mbtn{height:36px;border:0;border-radius:10px;background:#2C2C2E;color:var(--ink);font-weight:600;padding:0 12px;font-size:14px;flex:none}
.mprog{height:3px}
.np.ready .mbtn{background:var(--ok);color:#000;padding:0 18px}
.mprog i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
/* fullscreen focus */
.focus{position:fixed;inset:0;background:#000;z-index:4;transform:translateY(100%);transition:transform .34s cubic-bezier(.2,.8,.2,1),visibility 0s .34s;visibility:hidden;overflow-y:auto;overscroll-behavior:contain}
.focus.on{transform:none;visibility:visible;transition:transform .34s cubic-bezier(.2,.8,.2,1)}
.focusin{max-width:540px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;padding:calc(10px + env(safe-area-inset-top,0px)) 20px calc(20px + env(safe-area-inset-bottom,0px))}
.fhead{display:flex;justify-content:space-between;align-items:center;min-height:48px}
.fclose{width:44px;height:44px;border:0;border-radius:50%;background:var(--surface);color:var(--ink);display:flex;align-items:center;justify-content:center}
.fclose svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:2.2;stroke-linecap:round;stroke-linejoin:round}
.fhead .clock{margin:0}
.fbody{flex:1;display:flex;flex-direction:column;justify-content:center;text-align:center;padding:20px 0}
.flabel{font-size:15px;color:var(--muted);margin:4px 0}
.fname{font-size:30px;font-weight:600;line-height:1.15;margin:6px 0}
.fhuge{font-family:var(--display);font-weight:700;font-size:min(36vw,160px);line-height:1;font-variant-numeric:tabular-nums;margin:8px 0}
.fhuge.over{color:var(--ok)}
.fbar{height:6px;background:var(--surface);border-radius:3px;overflow:hidden;margin:14px 0 10px}
.fbar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.fins{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:22px 0 6px;text-align:left}
.fins input{width:100%;height:76px;border:0;border-radius:18px;background:var(--surface);text-align:center;font-family:var(--display);font-weight:700;font-size:42px}
.fins input::placeholder{color:var(--faint)}
.fnav{display:flex;justify-content:space-between;margin-top:6px}
.fbtns{display:grid;gap:10px}
.row3b{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px}
.go{height:62px;border:0;border-radius:18px;background:var(--ok);color:#000;font-weight:700;font-size:18px}
.go.accent{background:var(--accent);color:#fff}
.srow.next{box-shadow:inset 0 0 0 1.5px var(--accent)}
.hacts{display:flex;gap:8px;margin-top:10px}
.hacts .btn{height:36px;font-size:14px;flex:1}
.tact{background:none;border:0;font-weight:700;text-decoration:underline;color:inherit;margin-left:10px;padding:0}
/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.7);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.sheetbox{background:var(--surface);width:100%;max-width:540px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheetbox::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheetbox h3{font-family:var(--display);font-weight:700;font-size:30px;margin:0 0 12px}
.sheetbox p{margin:0 0 10px;font-size:15px}
.barviz{display:flex;align-items:center;justify-content:center;height:150px;gap:3px;margin:18px 0 6px}
.barviz .sl{height:12px;background:var(--faint);border-radius:3px}
.plate{width:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:12px;color:#1C1E21;writing-mode:vertical-rl}
.p15{height:140px;background:var(--pull)} .p10{height:118px;background:var(--push)} .p5{height:92px;background:var(--legs)}
.p2-5,.p2{height:72px;background:var(--gold)} .p1,.p1-25,.p0-5{height:56px;background:#D9DCE0}
.platenote{text-align:center;font-size:15px}
.erow{background:var(--sunk);border-radius:14px;padding:12px;margin-bottom:8px}
.erow input[type=text]{width:100%;height:42px;border:0;background:var(--sunk);border-radius:10px;padding:0 12px;margin-bottom:8px;font-weight:600}
.egrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.egrid label{font-size:12px;color:var(--muted)}
.egrid input,.egrid select{width:100%;height:38px;border:0;background:var(--sunk);border-radius:8px;padding:0 8px;margin:3px 0 0;font-size:15px;background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px}
.eacts{display:flex;justify-content:space-between;align-items:center}

.toast{pointer-events:auto;position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:#000;padding:10px 18px;border-radius:999px;font-size:15px;font-weight:500;display:none;z-index:6;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.on{display:block}
.toast.pr{background:linear-gradient(90deg,var(--push),var(--pull));color:#1C1E21}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="sub" id="topSub"></span><span class="clock" id="clock"></span></div>
  <main id="main"></main>
</div>

<div class="np" id="mini" role="button" tabindex="0" aria-label="Open current activity">
  <div class="np-in"><span class="mdot" id="mdot"></span><div class="mtext"><b id="mtitle"></b><span id="msub"></span></div><span class="mtime" id="mtime"></span><button class="mbtn" id="mbtn"></button></div>
  <div class="mprog"><i id="mprog"></i></div>
</div>
<div class="focus" id="focus" role="dialog" aria-modal="true" aria-label="Current activity"><div class="focusin" id="focusBody"></div></div>

<nav class="tabs" aria-label="Main">
  <div class="tabsin"><span class="navind" id="navind"></span>
    <button class="tab" data-view="log"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Train</button>
    <button class="tab" data-view="progress"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Progress</button>
    <button class="tab" data-view="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>History</button>
    <button class="tab" data-view="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
  </div>
</nav>

<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheetbox" id="sheetBody"></div></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= plan ================= */
const PLAN_VER = 2;
const DEFAULT_PLAN = {
  push:{name:"Push", ex:[
    {id:"dbbench",n:"Dumbbell bench press",sets:4,lo:8,hi:12,type:"db"},
    {id:"ohp",n:"Overhead press",sets:3,lo:6,hi:10,type:"bb"},
    {id:"dips",n:"Dips",sets:3,lo:6,hi:12,type:"bw"},
    {id:"lateral",n:"Lateral raises",sets:3,lo:12,hi:15,type:"db"},
    {id:"triext",n:"Overhead triceps extension",sets:2,lo:10,hi:12,type:"db"}
  ]},
  pull:{name:"Pull", ex:[
    {id:"pullups",n:"Pull-ups",sets:4,max:true,type:"bw"},
    {id:"bbrow",n:"Barbell row",sets:4,lo:8,hi:10,type:"bb"},
    {id:"reardelt",n:"Rear-delt fly (bent over, dumbbells)",sets:3,lo:12,hi:15,type:"db"},
    {id:"bbcurl",n:"Barbell curl",sets:3,lo:8,hi:12,type:"bb"}
  ]},
  legs:{name:"Legs", ex:[
    {id:"bss",n:"Bulgarian split squat",sets:3,lo:8,hi:12,type:"db"},
    {id:"rdl",n:"Romanian deadlift",sets:4,lo:8,hi:10,type:"bb"},
    {id:"sissy",n:"Sissy squat (hold doorframe)",sets:3,lo:8,hi:15,type:"bw"},
    {id:"slidecurl",n:"Sliding leg curl (socks on floor)",sets:3,lo:8,hi:12,type:"bw"},
    {id:"calf",n:"Stair calf raises",sets:4,lo:15,hi:20,type:"bw"}
  ]}
};
const ORDER = ["push","pull","legs"];
const TABS = ["push","pull","legs","cardio"];
const LEGACY = {legext:{n:"Leg extension",type:"db"}, legcurl:{n:"Leg curl",type:"db"},
  pushups:{n:"Push-ups",type:"bw"}, chinups:{n:"Chin-ups",type:"bw"}, dbrow:{n:"One-arm dumbbell row",type:"db"},
  hammer:{n:"Hammer curl",type:"db"}, goblet:{n:"Goblet or front squat",type:"db"}, stairs:{n:"Stair sprints or step-ups",type:"bw"}};
const ACTIVITIES = [["bike","Bike"],["stairs","Stairs"],["run","Run"],["walk","Walk"],["other","Other"]];
const actName = k => (ACTIVITIES.find(a => a[0] === k) || [k, "Cardio"])[1];

/* ================= state ================= */
const KEY = "ppl-log-v2", OLDKEY = "ppl-log-v1";
const clone = o => JSON.parse(JSON.stringify(o));
function defSettings(){ return {rest:90, autoRest:true, theme:"auto", notif:false, sound:true, countdown:true, vibrate:true, wake:true, weekGoal:3, bar:10, plates:{"15":2,"10":2,"5":2,"2":0,"1":8}}; }
function defaults(){ return {v:2, planV:PLAN_VER, retired:{}, plan:clone(DEFAULT_PLAN), sessions:[], draft:{}, day:"push", next:"push", settings:defSettings()}; }
// Remember name/type of exercises that leave the plan so old logs keep showing them.
function retire(d, oldPlan, newPlan){
  const keep = new Set(); for(const k of ORDER) newPlan[k].ex.forEach(e => keep.add(e.id));
  d.retired = d.retired || {};
  for(const k of ORDER) ((oldPlan[k] || {}).ex || []).forEach(e => { if(!keep.has(e.id)) d.retired[e.id] = {n:e.n, type:e.type}; });
}
// Plan v2: overlap trim. Same ids stay; sets/reps follow the new default, names and types stay as saved.
function migratePlan(d){
  if((d.planV || 1) >= PLAN_VER) return;
  const old = d.plan || {}, next = clone(DEFAULT_PLAN);
  for(const k of ORDER){
    const prev = ((old[k] || {}).ex || []);
    if(old[k] && old[k].name) next[k].name = old[k].name;
    next[k].ex.forEach(e => { const p = prev.find(x => x.id === e.id); if(p){ e.n = p.n || e.n; e.type = p.type || e.type; } });
  }
  retire(d, old, next);
  d.plan = next; d.planV = PLAN_VER;
  // drop untouched drafts so they rebuild with the new set counts
  for(const k in (d.draft || {})){ const dr = d.draft[k]; if(dr && dr.ex) for(const id in dr.ex) if(!dr.ex[id].some(x => x.w || x.r || x.d)) delete dr.ex[id]; }
}
function load(){
  let s = null; try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  const d = defaults();
  if(s && s.v === 2){ Object.assign(d, s); d.planV = s.planV || 1; d.settings = Object.assign(defSettings(), s.settings || {}); if(!d.next) d.next = ORDER.includes(d.day) ? d.day : "push"; migratePlan(d); return d; }
  try{
    const o = JSON.parse(localStorage.getItem(OLDKEY));
    if(o && Array.isArray(o.sessions)){ d.sessions = o.sessions; d.day = d.next = o.day || "push"; d.settings.rest = o.rest || 90;
      for(const k in (o.draft || {})) d.draft[k] = {start:null, ex:o.draft[k], note:""}; }
  }catch(e){}
  return d;
}
let state = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast("Couldn't save. Storage is full or blocked."); } }
let view = "log";

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
const e1rm = (w, r) => w * (1 + r / 30);
const round1 = n => Math.round(n * 10) / 10;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const dayName = k => k === "cardio" ? "Cardio" : (state.plan[k] ? state.plan[k].name : k);
function exById(id){ for(const k of ORDER){ const e = state.plan[k].ex.find(x => x.id === id); if(e) return e; } const r = (state.retired || {})[id] || LEGACY[id]; return {id, n:r ? r.n : id, type:r ? r.type : "db"}; }
const isBW = e => e.type === "bw";
function dateKey(d){ d = new Date(d); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
function weekStart(d){ d = new Date(d); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }
function fmtDur(ms){ const s = Math.max(0, Math.floor(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); }
const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, {weekday:"short", day:"numeric", month:"short"});
function setsText(e, sets){
  const w = sets[0].w, same = sets.every(s => s.w === w);
  const wt = w ? (isBW(e) ? "+" + w : w) + " kg × " : "";
  return same ? wt + sets.map(s => s.r).join(", ") : sets.map(s => (s.w ? s.w + "×" : "") + s.r).join(", ");
}
function lastFor(id){ for(let i = state.sessions.length - 1; i >= 0; i--){ const s = (state.sessions[i].ex || {})[id]; if(s && s.length) return s; } return null; }
function bestFor(id){
  let best = null;
  for(const s of state.sessions) for(const set of ((s.ex || {})[id] || [])){
    const score = set.w ? e1rm(set.w, set.r) : set.r;
    if(!best || score > best.score) best = {score, w:set.w, r:set.r};
  }
  return best;
}
const strength = () => state.sessions.filter(s => s.day !== "cardio");
const cardioS = () => state.sessions.filter(s => s.day === "cardio");
function inWeek(s, ws){ const we = new Date(ws); we.setDate(we.getDate() + 7); const d = new Date(s.date); return d >= ws && d < we; }

/* ================= sound + vibration ================= */
// Pre-rendered WAV clips play through the media channel, which Android handles more reliably than WebAudio.
function wav(tones){
  const sr = 22050, parts = tones.map(([f, ms]) => Math.floor(sr * ms / 1000)), n = parts.reduce((a,b) => a+b, 0);
  const buf = new ArrayBuffer(44 + n*2), v = new DataView(buf), str = (o, s) => { for(let i = 0; i < s.length; i++) v.setUint8(o+i, s.charCodeAt(i)); };
  str(0,"RIFF"); v.setUint32(4, 36 + n*2, true); str(8,"WAVE"); str(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); str(36,"data"); v.setUint32(40,n*2,true);
  let o = 44;
  tones.forEach(([f], ti) => { const len = parts[ti];
    for(let i = 0; i < len; i++){ const env = f ? Math.min(1, i/150, (len-i)/300) : 0; v.setInt16(o, Math.sin(2*Math.PI*f*i/sr) * .7 * env * 32767, true); o += 2; } });
  return URL.createObjectURL(new Blob([buf], {type:"audio/wav"}));
}
const SOUNDS = {
  done: wav([[880,170],[0,90],[880,170],[0,90],[1175,320]]),
  tick: wav([[660,80]]),
  work: wav([[988,140],[0,70],[1319,260]]),
  rest: wav([[523,380]])
};
const players = {};
for(const k in SOUNDS){ players[k] = new Audio(SOUNDS[k]); players[k].preload = "auto"; }
let unlocked = false;
function unlockAudio(){
  if(unlocked) return; unlocked = true;
  for(const k in players){ const a = players[k]; a.muted = true; a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; unlocked = false; }); }
}
document.addEventListener("pointerdown", unlockAudio, {capture:true});
function play(k){
  if(!state.settings.sound) return Promise.resolve(false);
  const a = players[k]; a.muted = false; a.currentTime = 0;
  return a.play().then(() => true).catch(() => fallbackBeep(k));
}
let actx = null;
function fallbackBeep(k){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.frequency.value = k === "rest" ? 523 : 880; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.4, t+.02); g.gain.exponentialRampToValueAtTime(.0001, t+.3);
    o.start(t); o.stop(t+.32); return true;
  }catch(e){ return false; }
}
function buzz(pattern){
  if(!state.settings.vibrate || !("vibrate" in navigator)) return false;
  try{ return navigator.vibrate(pattern); }catch(e){ return false; }
}
async function notify(title, body, force){
  const st = state.settings;
  if(!st.notif || !("Notification" in window) || Notification.permission !== "granted") return false;
  if(!document.hidden && !force) return false;
  try{
    const reg = await navigator.serviceWorker?.getRegistration();
    const opts = {body, icon:"icon-192.png", badge:"icon-192.png", tag:"ppl", renotify:true, vibrate:[300,120,300]};
    if(reg) await reg.showNotification(title, opts); else new Notification(title, opts);
    return true;
  }catch(e){ return false; }
}
function signal(kind){
  if(kind === "done"){ play("done"); buzz([300,120,300,120,500]); notify("Rest is over", "Time for your next set."); }
  else if(kind === "tick"){ if(state.settings.countdown){ play("tick"); buzz(60); } }
  else if(kind === "work"){ play("work"); buzz([200,80,200]); notify("Go", "Work interval started."); }
  else if(kind === "rest"){ play("rest"); buzz(400); }
  else if(kind === "finish"){ play("done"); buzz([300,120,300,120,500]); notify("Intervals done", "Nice work. Save your cardio."); }
}

/* ================= drafts ================= */
function draftFor(day){
  let d = state.draft[day];
  if(!d || !d.ex) d = state.draft[day] = {start:null, ex:{}, note:""};
  state.plan[day].ex.forEach(e => { if(!d.ex[e.id]) d.ex[e.id] = Array.from({length:e.sets}, () => ({w:"", r:"", d:false})); });
  return d;
}
function ensureStart(){ const d = draftFor(state.day); if(!d.start){ d.start = Date.now(); save(); wake(true); renderTop(); } }
function cdraft(){
  if(!state.draft.cardio) state.draft.cardio = {type:"bike", mode:"free", elapsed:0, runStart:null, manual:"", dist:"", level:"", effort:"", note:"", work:30, rest:60, rounds:8};
  return state.draft.cardio;
}
const cElapsed = c => c.elapsed + (c.runStart ? Date.now() - c.runStart : 0);

/* ================= theme ================= */
function applyTheme(){}

/* ================= top bar ================= */
function renderTop(){
  let c = "";
  const d = state.draft[state.day];
  if(state.day === "cardio"){ const cd = state.draft.cardio; if(cd && (cd.runStart || cd.elapsed)) c = "Cardio " + fmtDur(cElapsed(cd)); }
  else if(d && d.start) c = dayName(state.day) + " " + fmtDur(Date.now() - d.start);
  $("clock").textContent = c;
}
setInterval(renderTop, 1000);

/* ================= train view ================= */
let segFrom = null;
function segHTML(){
  const idx = TABS.indexOf(state.day), from = segFrom === null ? idx : segFrom;
  return `<div class="seg" role="tablist" id="seg"><span class="segind" style="width:calc((100% - 8px) / 4);transform:translateX(${from * 100}%)" data-to="${idx}"></span>${TABS.map(k => `<button role="tab" data-act="day" data-day="${k}" aria-selected="${k === state.day}"><i style="background:var(--${k})"></i>${esc(dayName(k))}</button>`).join("")}</div>`;
}
function slideSeg(){
  const ind = document.querySelector(".segind"); if(!ind) return;
  requestAnimationFrame(() => requestAnimationFrame(() => { ind.style.transform = `translateX(${ind.dataset.to * 100}%)`; }));
  segFrom = null;
}
function lastDoneText(k){
  const s = [...state.sessions].reverse().find(x => x.day === k);
  return s ? "Last done " + fmtDate(s.date) : "Not done yet";
}
function prevText(e, p){
  if(!p) return "–";
  if(p.w) return (isBW(e) ? "+" + p.w : p.w) + " × " + p.r;
  return isBW(e) ? "BW × " + p.r : p.r + " reps";
}
function tipsHTML(){
  return `<div class="card tips stack" style="margin-bottom:14px"><h3>How it works</h3><ol>
    <li>Pick a day at the top. The app opens on the next day in your rotation.</li>
    <li>Type the kg and reps you did. <b>Previous</b> shows last time; tap it to copy.</li>
    <li>Tap the circle when a set is done. A rest timer starts at the bottom.</li>
    <li>Tap <b>Start</b> on the bar above the tabs to begin. It then shows your next set or rest; tap it for full screen.</li>
    <li>Tap an exercise to open or close it. The one you're on opens by itself.</li>
    <li>Tap <b>Finish</b> when you're done. Swipe left or right to switch tabs.</li></ol>
    <button class="mini" data-act="tipsok">Got it</button></div>`;
}
let exOpen = {}, lastNx = null;
function renderLog(){
  if(state.day === "cardio") return renderCardio();
  const day = state.day, plan = state.plan[day], d = draftFor(day);
  let total = 0, done = 0;
  plan.ex.forEach(e => d.ex[e.id].forEach(s => { total++; if(s.d) done++; }));
  const nx = nextSet();
  let h = segHTML();
  if(!state.tipsSeen) h += tipsHTML();
  h += `<h1>${esc(plan.name)}</h1><p class="lede">${day === state.next ? "Up next. " : ""}${lastDoneText(day)}</p>`;
  if(d.start || done) h += `<div class="wbar"><div class="wbar-in"><span><b>${done}</b> of ${total} sets done</span><button class="mini" data-act="finish">Finish</button></div><div class="wprog"><i style="width:${total ? done/total*100 : 0}%"></i></div></div>`;
  if(nx && nx.e.id !== lastNx){ exOpen = {}; lastNx = nx.e.id; }
  h += '<div class="stack ex-list">';
  plan.ex.forEach(e => {
    const last = lastFor(e.id), best = bestFor(e.id), sets = d.ex[e.id];
    const ready = last && !e.max && last.length >= e.sets && last.every(s => s.r >= e.hi);
    const nDone = sets.filter(s => s.d).length;
    const target = e.max ? `${e.sets} ${e.sets > 1 ? "sets" : "set"}, as many ${e.unit || "reps"} as you can` : `${e.sets} sets of ${e.lo}–${e.hi} reps`;
    const open = exOpen[e.id] ?? (nx ? nx.e.id === e.id : false);
    h += `<section class="card ex${nDone === sets.length ? " exdone" : ""}${open ? " open" : ""}" data-ex="${e.id}">
      <button class="exbtn" data-act="toggleex" aria-expanded="${open}"><h3 class="exname">${esc(e.n)}</h3><span class="exmeta"><span>${target}</span>${ready ? '<span class="pill">Ready: add 1–2 kg</span>' : ""}</span><span class="count">${nDone}/${sets.length}</span><svg class="chev" viewBox="0 0 24 24"><path d="M6 9l6 6 6-6"/></svg></button>
      <div class="exbody"><div><div class="exinner">
      <div class="sgrid shead"><span>Set</span><span>Previous</span><span>${isBW(e) ? "+kg" : "kg"}</span><span>${e.unit === "rounds" ? "Rounds" : "Reps"}</span><span></span></div>`;
    sets.forEach((s, i) => {
      const p = last ? last[i] : null, isNext = nx && nx.e.id === e.id && nx.i === i && (d.start || done);
      h += `<div class="sgrid srow${s.d ? " done" : ""}${isNext ? " next" : ""}" data-i="${i}">
        <span class="setno">${i+1}</span>
        <button class="prev" data-act="copyprev" ${p ? "" : "disabled"} aria-label="Copy previous">${esc(prevText(e, p))}</button>
        <input class="sin" inputmode="decimal" data-k="w" value="${esc(s.w)}" placeholder="${isBW(e) ? "0" : ""}" aria-label="Set ${i+1} weight">
        <input class="sin" inputmode="numeric" data-k="r" value="${esc(s.r)}" aria-label="Set ${i+1} reps">
        <button class="check2" data-act="tick" aria-pressed="${!!s.d}" aria-label="Set ${i+1} done">✓</button></div>`;
    });
    h += `<button class="addrow" data-act="addset">+ Add set</button>
      <div class="exfoot2">${sets.length > 1 ? '<button class="ghost" data-act="delset">Remove last set</button>' : ""}${e.type === "bb" ? '<button class="ghost" data-act="plates">Plate calculator</button>' : ""}</div></div></div></div></section>`;
  });
  h += `<textarea data-k="note" rows="2" placeholder="Notes for this workout (optional)">${esc(d.note)}</textarea>
    <button class="primary" data-act="finish">Finish ${esc(plan.name.toLowerCase())} workout</button></div>
    ${d.start ? '<p class="center"><button class="textlink" data-act="discard">Discard this workout</button></p>' : ""}`;
  $("main").innerHTML = h;
  slideSeg();
}

/* ================= cardio ================= */
let lastPhase = null, lastTick = -1;
function intervalState(c){
  const t = Math.floor(cElapsed(c) / 1000), cyc = c.work + c.rest, total = c.rounds * cyc - c.rest;
  if(t >= total) return {done:true, round:c.rounds, total};
  const round = Math.floor(t / cyc) + 1, inC = t % cyc, work = inC < c.work;
  return {done:false, round, work, left: work ? c.work - inC : cyc - inC, len: work ? c.work : c.rest, total, t};
}
function renderCardio(){
  const c = cdraft(), running = !!c.runStart, started = running || c.elapsed > 0;

    <div class="card">
      <div class="seg two" role="tablist"><button role="tab" data-act="cmode" data-val="free" aria-selected="${c.mode === "free"}">Stopwatch</button><button role="tab" data-act="cmode" data-val="intervals" aria-selected="${c.mode === "intervals"}">Intervals</button></div>`;

        ${["bike","run","walk"].includes(c.type) ? `<label><span class="lab">Distance (km)</span><input class="inp" inputmode="decimal" data-c="dist" value="${esc(c.dist)}" placeholder="–"></label>` : `<label><span class="lab">${c.type === "stairs" ? "Floors or rounds" : "Distance (km)"}</span><input class="inp" inputmode="decimal" data-c="dist" value="${esc(c.dist)}" placeholder="–"></label>`}

    </div>

function setTxt(id, t){ const el = $(id); if(el && el.textContent !== t) el.textContent = t; }
function cardioLive(){
  const c = state.draft.cardio; if(!c) return null;
  const ms = cElapsed(c);
  if(c.mode === "intervals"){
    const s = intervalState(c);
    if(s.done) return {time:fmtDur(s.total*1000), phase:"All " + c.rounds + " rounds done", pct:100, work:false, s, ms};
    return {time:fmtDur(s.left*1000), phase:(s.work ? "Work" : "Rest") + ", round " + s.round + " of " + c.rounds, pct:(1 - s.left/s.len)*100, work:s.work && !!c.runStart, s, ms};
  }
  return {time:fmtDur(ms), phase:c.runStart ? "Running" : ms ? "Paused" : "Ready", pct:(ms/60000)%1*100, work:false, ms};
}
function updateCardio(){
  const c = state.draft.cardio; if(!c) return;
  const L = cardioLive();
  if(c.mode === "intervals" && c.runStart){
    const s = L.s;
    if(s.done){ c.elapsed = s.total*1000; c.runStart = null; save(); signal("finish"); wake(false); lastPhase = null; if(view === "log" && state.day === "cardio") renderCardio(); if(focusOpen) renderFocus(); return; }
    const key = s.round + (s.work ? "w" : "r");
    if(lastPhase !== null && key !== lastPhase) signal(s.work ? "work" : "rest");
    lastPhase = key;
    if(s.left <= 3 && s.left >= 1 && lastTick !== s.t){ lastTick = s.t; signal("tick"); }
  }
  for(const pre of ["c","f"]){
    if(!$(pre + "Time")) continue;
    setTxt(pre + "Time", L.time); setTxt(pre + "Phase", L.phase + (c.mode === "intervals" && L.ms ? ", total " + fmtDur(L.ms) : ""));
    $(pre + "Phase").className = (pre === "c" ? "phase" : "flabel") + (L.work ? " work" : "");
    $(pre + "Bar").style.width = L.pct + "%";
  }
}

function cardioAction(act, val){
  const c = cdraft();
  switch(act){
    case "ctype": c.type = val; save(); renderCardio(); break;
    case "cmode": if(c.runStart || c.elapsed){ toast("Reset the timer to switch modes"); return; } c.mode = val; save(); renderCardio(); break;
    case "ceffort": c.effort = c.effort === val ? "" : val; save(); renderCardio(); break;
    case "cgo":
      if(c.runStart){ c.elapsed = cElapsed(c); c.runStart = null; wake(false); }
      else {
        if(c.mode === "intervals"){
          c.work = Math.max(5, c.work || 30); c.rest = Math.max(0, c.rest ?? 60); c.rounds = Math.max(1, c.rounds || 8);
          if(intervalState(c).done) c.elapsed = 0;
          if(!c.elapsed){ lastPhase = null; signal("work"); }
        }
        c.runStart = Date.now(); wake(true);
      }
      save(); if(view === "log" && state.day === "cardio") renderCardio(); if(focusOpen) renderFocus(); renderTop(); updateLive(); break;
    case "creset": if(confirm("Reset the timer to zero?")){ c.elapsed = 0; c.runStart = null; lastPhase = null; save(); wake(false); if(view === "log") renderCardio(); if(focusOpen) renderFocus(); renderTop(); updateLive(); } break;
    case "csave": {
      const mins = num(c.manual);
      const dur = mins ? mins * 60000 : cElapsed(c);
      if(dur < 60000){ toast("Log at least 1 minute first"); return; }
      state.sessions.push({id:Date.now().toString(36), day:"cardio", date:new Date().toISOString(), dur, note:(c.note || "").trim(), ex:{},
        cardio:{type:c.type, dist:num(c.dist), level:num(c.level), effort:c.effort || null, intervals: c.mode === "intervals" && !mins ? {work:c.work, rest:c.rest, rounds:c.rounds} : null}});
      const keep = {type:c.type, mode:c.mode, work:c.work, rest:c.rest, rounds:c.rounds}, backup = clone(c), sid = state.sessions[state.sessions.length-1].id;
      delete state.draft.cardio; Object.assign(cdraft(), keep);
      wake(false); stopTimer(); closeFocus(); save(); goView("progress");
      toast(actName(c.type) + " saved, " + Math.round(dur/60000) + " min", false, {label:"Undo", fn:() => {
        state.sessions = state.sessions.filter(x => x.id !== sid); state.draft.cardio = backup; state.day = "cardio"; save(); view = "progress"; goView("log"); }});
    }
  }
}

/* ================= progress ================= */
let charts = [], progEx = null;

function streak(){
  const goal = state.settings.weekGoal, S = strength(); let ws = weekStart(new Date()), n = 0;
  const cnt = w => S.filter(s => inWeek(s, w)).length;
  if(cnt(ws) < goal) ws.setDate(ws.getDate() - 7);
  while(cnt(ws) >= goal){ n++; ws.setDate(ws.getDate() - 7); }
  return n;
}

function drawExChart(){

function drawWeekly(id, keys, val){

    keys.forEach(k => data[k].push(state.sessions.filter(s => s.day === k && inWeek(s, ws)).reduce((a,s) => a + val(s), 0)));

/* ================= router ================= */
const VIEWS = ["log","progress","history","settings"];
const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
function moveNav(){ $("navind").style.transform = `translateX(${VIEWS.indexOf(view) * 100}%)`; }
let swapping = false;
function swapMain(dir, fn, keepScroll){
  const m = $("main");
  if(reduceMotion || !m.animate){ fn(); if(!keepScroll) window.scrollTo(0,0); return; }
  if(swapping){ fn(); return; }
  swapping = true;
  m.animate([{transform:"translateX(0)", opacity:1}, {transform:`translateX(${-dir * 36}px)`, opacity:0}], {duration:110, easing:"ease-in"}).finished.then(() => {
    fn(); if(!keepScroll) window.scrollTo(0,0);
    m.animate([{transform:`translateX(${dir * 36}px)`, opacity:0}, {transform:"translateX(0)", opacity:1}], {duration:200, easing:"cubic-bezier(.2,.8,.2,1)"});
    swapping = false;
  });
}
function render(){
  document.querySelectorAll(".tab").forEach(t => t.dataset.view === view ? t.setAttribute("aria-current","page") : t.removeAttribute("aria-current"));
  moveNav();
  if(view !== "progress") killCharts();
  ({log:renderLog, progress:renderProgress, history:renderHistory, settings:renderSettings})[view]();
  renderTop(); updateLive();
}
function goView(v){
  if(v === view){ render(); return; }
  const dir = VIEWS.indexOf(v) > VIEWS.indexOf(view) ? 1 : -1;
  view = v; moveNav();
  document.querySelectorAll(".tab").forEach(t => t.dataset.view === view ? t.setAttribute("aria-current","page") : t.removeAttribute("aria-current"));
  swapMain(dir, render);
}
document.querySelectorAll(".tab").forEach(t => t.onclick = () => goView(t.dataset.view));
// swipe between tabs
let sx = null, sy = null, st0 = 0;
document.addEventListener("touchstart", ev => {
  const t = ev.target;
  if(ev.touches.length !== 1 || focusOpen || $("sheet").classList.contains("on") || t.closest("input,textarea,select,canvas,.chips,.np,.focus")){ sx = null; return; }
  sx = ev.touches[0].clientX; sy = ev.touches[0].clientY; st0 = Date.now();
}, {passive:true});
document.addEventListener("touchend", ev => {
  if(sx === null) return;
  const dx = ev.changedTouches[0].clientX - sx, dy = ev.changedTouches[0].clientY - sy; sx = null;
  if(Math.abs(dx) < 70 || Math.abs(dy) > Math.abs(dx) * 0.6 || Date.now() - st0 > 600) return;
  const i = VIEWS.indexOf(view) + (dx < 0 ? 1 : -1);
  if(i >= 0 && i < VIEWS.length) goView(VIEWS[i]);
}, {passive:true});

$("main").addEventListener("input", ev => {
  const t = ev.target;
  if(t.dataset.c){ const c = cdraft(), k = t.dataset.c; c[k] = ["work","rest","rounds"].includes(k) ? (parseInt(t.value) || 0) : t.value; save(); return; }
  if(t.dataset.k === "note"){ draftFor(state.day).note = t.value; save(); return; }
  if(t.dataset.k){ const ex = t.closest(".ex").dataset.ex, i = +t.closest(".srow").dataset.i; draftFor(state.day).ex[ex][i][t.dataset.k] = t.value; save(); if(t.value) ensureStart(); return; }
  if(t.dataset.set === "bar"){ const v = num(t.value); if(v !== null){ state.settings.bar = v; save(); } return; }
  if(t.dataset.plate){ const v = parseInt(t.value); if(!isNaN(v) && v >= 0){ state.settings.plates[t.dataset.plate] = v; save(); } }
});
$("main").addEventListener("click", async ev => {
  const b = ev.target.closest("[data-act]"); if(!b || b.disabled) return;
  const act = b.dataset.act, card = b.closest(".ex"), exId = card && card.dataset.ex, d = state.draft[state.day];
  if(["ctype","cmode","ceffort","cgo","creset","csave"].includes(act)) return cardioAction(act, b.dataset.val);
  switch(act){

  if(total === null) return '<p class="platenote">Type a weight above.</p>';
  const r = plateMath(total); if(r.err) return `<p class="platenote">${r.err}</p>`;
  const side = r.out.map(p => `<div class="plate p${String(p).replace(".","-")}">${p}</div>`);
  let h = `<div class="barviz"><div class="sl" style="width:24px"></div>${[...side].reverse().join("")}<div class="sl" style="width:70px;height:7px"></div>${side.join("")}<div class="sl" style="width:24px"></div></div>`;
  h += `<p class="platenote">${r.out.length ? "Each side: " + r.out.join(" + ") + " kg" : "Just the bar"}</p>`;
  if(r.left > 0) h += `<p class="platenote" style="color:var(--accent)">Your plates can't make this exactly. Closest is ${round1(total - r.left)} kg.</p>`;
  return h;
}
function openPlates(exId){
  const sets = state.draft[state.day].ex[exId], last = lastFor(exId), w = num(sets.find(s => s.w)?.w) ?? (last ? last[0].w : null);
  openSheet(`<h3>Plates</h3><p>Total weight including the ${state.settings.bar} kg bar</p>
    <label class="field"><input id="plateIn" inputmode="decimal" value="${w ?? ""}" placeholder="40"><em>kg</em></label>
    <div id="plateOut">${plateHTML(w)}</div><button class="secondary" style="width:100%;margin-top:12px" id="pClose">Done</button>`);
  $("plateIn").oninput = ev => $("plateOut").innerHTML = plateHTML(num(ev.target.value));
  $("pClose").onclick = closeSheet;
}
let ep = null, epDay = "push";
function openEditor(){ ep = clone(state.plan); epDay = ORDER.includes(state.day) ? state.day : "push"; drawEditor(); }
function drawEditor(){
  const day = ep[epDay];
  let h = `<h3>Edit plan</h3><div class="seg" style="grid-template-columns:repeat(3,1fr)">${ORDER.map(k => `<button data-ed="day" data-day="${k}" aria-selected="${k === epDay}"><i style="background:var(--${k})"></i>${esc(ep[k].name)}</button>`).join("")}</div>
    <label style="display:block;margin-bottom:12px"><span class="lab">Day name</span><input class="inp" data-ed="dayname" value="${esc(day.name)}"></label>`;
  day.ex.forEach((e, i) => {
    h += `<div class="erow" data-i="${i}"><input type="text" data-f="n" value="${esc(e.n)}" aria-label="Exercise name">
      <div class="egrid"><label>Sets<input inputmode="numeric" data-f="sets" value="${e.sets}"></label><label>Min reps<input inputmode="numeric" data-f="lo" value="${e.max ? "" : e.lo}" placeholder="max"></label><label>Max reps<input inputmode="numeric" data-f="hi" value="${e.max ? "" : e.hi}" placeholder="max"></label></div>
      <div class="egrid" style="grid-template-columns:1fr"><label>Equipment<select data-f="type"><option value="bb"${e.type==="bb"?" selected":""}>Barbell</option><option value="db"${e.type==="db"?" selected":""}>Dumbbells</option><option value="bw"${e.type==="bw"?" selected":""}>Bodyweight</option></select></label></div>
      <div class="eacts"><span><button class="ghost" data-ed="up">Up</button><button class="ghost" data-ed="down">Down</button></span><button class="ghost" data-ed="del" style="color:var(--accent)">Remove</button></div></div>`;
  });
  h += `<button class="secondary" data-ed="add" style="width:100%;margin-bottom:10px">Add exercise</button>
    <div class="btnpair"><button class="primary" data-ed="save">Save plan</button><button class="secondary" data-ed="cancel">Cancel</button></div>
    <p class="note">Leave min and max reps empty for as-many-as-possible sets. <button class="textlink" data-ed="default">Restore original plan</button></p>`;
  openSheet(h);
}
$("sheetBody").addEventListener("input", ev => {
  if(!ep) return; const t = ev.target;
  if(t.dataset.ed === "dayname"){ ep[epDay].name = t.value; return; }
  const row = t.closest(".erow"); if(!row || !t.dataset.f) return;
  const e = ep[epDay].ex[+row.dataset.i], f = t.dataset.f;
  if(f === "n" || f === "type") e[f] = t.value; else { const v = parseInt(t.value); e[f] = isNaN(v) ? null : v; }
});
$("sheetBody").addEventListener("change", ev => { if(ep && ev.target.dataset.f === "type") ep[epDay].ex[+ev.target.closest(".erow").dataset.i].type = ev.target.value; });
$("sheetBody").addEventListener("click", ev => {
  const b = ev.target.closest("[data-ed]"); if(!b || !ep) return;
  const list = ep[epDay].ex, row = b.closest(".erow"), i = row ? +row.dataset.i : -1;
  switch(b.dataset.ed){
    case "day": epDay = b.dataset.day; drawEditor(); break;
    case "up": if(i > 0){ [list[i-1], list[i]] = [list[i], list[i-1]]; drawEditor(); } break;
    case "down": if(i < list.length-1){ [list[i+1], list[i]] = [list[i], list[i+1]]; drawEditor(); } break;
    case "del": if(confirm("Remove " + list[i].n + "? Past logs stay.")){ list.splice(i,1); drawEditor(); } break;
    case "add": list.push({id:"x" + Date.now().toString(36), n:"New exercise", sets:3, lo:8, hi:12, type:"db"}); drawEditor(); break;
    case "cancel": closeSheet(); break;
    case "default": if(confirm("Restore the original plan? Past logs stay.")){ ep = clone(DEFAULT_PLAN); drawEditor(); } break;
    case "save":
      for(const k of ORDER){
        if(!ep[k].name.trim()) ep[k].name = DEFAULT_PLAN[k].name;
        ep[k].ex.forEach(e => { e.n = (e.n || "").trim() || "Exercise"; e.sets = Math.min(10, Math.max(1, e.sets || 3));
          if(!e.lo && !e.hi){ e.max = true; delete e.lo; delete e.hi; } else { e.max = false; e.lo = e.lo || e.hi; e.hi = Math.max(e.hi || e.lo, e.lo); } });
      }
      retire(state, state.plan, ep); state.plan = ep;
      for(const k of ORDER){ const d = state.draft[k]; if(d && !d.start) delete state.draft[k]; }
      save(); closeSheet(); render(); toast("Plan saved");
  }
});

/* ================= toast ================= */
let toastT;
function toast(msg, pr, action){
  const t = $("toast"); t.textContent = msg;
  if(action){ const b = document.createElement("button"); b.className = "tact"; b.textContent = action.label; b.onclick = () => { t.classList.remove("on"); action.fn(); }; t.appendChild(b); }
  t.classList.toggle("pr", !!pr); t.classList.add("on"); clearTimeout(toastT);
  toastT = setTimeout(() => t.classList.remove("on"), action ? 6000 : pr ? 3200 : 2600);
}

/* ================= boot ================= */
applyTheme();
render();
{ const d = state.draft[state.day], c = state.draft.cardio; if((d && d.start) || (c && c.runStart)) wake(true); }
if("serviceWorker" in navigator) window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
</script>
</body>
