<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PPL Log">
<meta name="theme-color" content="#121315" id="themeColor">
<title>PPL Log</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<script src="chart.umd.js"></script>
<style>
:root{
  --bg:#F4F4F2; --surface:#FFFFFF; --sunk:#EEEEEA; --ink:#1C1E21; --muted:#6E7277; --faint:#A3A7AC;
  --line:#E4E4E0; --accent:#D9483F; --ok:#2F8A57; --okbg:#E4F3EA;
  --push:#F2A3C2; --pull:#93C3F2; --legs:#9FDDBE; --cardio:#C7B5F4; --gold:#EBCB7A;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --nav:62px; --r:16px;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#121315; --surface:#1C1D20; --sunk:#26282C; --ink:#EDEEF0; --muted:#8E9399; --faint:#5C6066;
    --line:#2C2E33; --accent:#EE5A50; --ok:#5CC28A; --okbg:#1B2E24;
  }
}
:root[data-theme="dark"]{
  --bg:#121315; --surface:#1C1D20; --sunk:#26282C; --ink:#EDEEF0; --muted:#8E9399; --faint:#5C6066;
  --line:#2C2E33; --accent:#EE5A50; --ok:#5CC28A; --okbg:#1B2E24;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:contain}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer;-webkit-user-select:none;user-select:none}
input,textarea,select{outline:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
input:focus,textarea:focus,select:focus{box-shadow:0 0 0 2px var(--accent)}
.wrap{max-width:540px;margin:0 auto;padding:10px 16px calc(var(--nav) + 130px + env(safe-area-inset-bottom,0px))}

.top{display:flex;justify-content:space-between;align-items:center;height:36px;margin-bottom:6px}
.top .sub{font-size:14px;color:var(--muted)}
.clock{font-family:var(--display);font-weight:600;font-size:17px;background:var(--surface);border-radius:999px;padding:4px 12px 4px 10px;display:flex;align-items:center;gap:7px}
.clock::before{content:"";width:7px;height:7px;border-radius:50%;background:var(--accent);animation:pulse 2s infinite}
.clock:empty{display:none}
@keyframes pulse{50%{opacity:.35}}

.seg{display:grid;grid-template-columns:repeat(4,1fr);background:var(--sunk);border-radius:14px;padding:4px;gap:2px;margin-bottom:20px}
.seg button{border:0;background:none;border-radius:10px;height:38px;font-size:15px;font-weight:500;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.seg button i{width:7px;height:7px;border-radius:50%}
.seg button[aria-selected="true"]{background:var(--surface);color:var(--ink);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}
.seg.two{grid-template-columns:1fr 1fr;margin-bottom:14px}

h1{font-family:var(--display);font-weight:700;font-size:46px;line-height:1;margin:0}
.lede{color:var(--muted);font-size:15px;margin:6px 0 18px}

.card{background:var(--surface);border-radius:var(--r);padding:16px}
.stack>*+*{margin-top:10px}
.exname{font-weight:600;font-size:18px;margin:0;line-height:1.25}
.exmeta{font-size:14px;color:var(--muted);margin:2px 0 12px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:center}
.pill{display:inline-block;font-size:12px;font-weight:600;padding:2px 9px;border-radius:999px;background:var(--okbg);color:var(--ok)}
.setrow{display:grid;grid-template-columns:24px 1fr 1fr 44px;gap:8px;align-items:center;margin-bottom:8px}
.setno{font-size:14px;color:var(--faint);text-align:center;font-weight:600}
.field{position:relative;display:block}
.field input{width:100%;height:44px;border:0;background:var(--sunk);border-radius:12px;padding:0 40px 0 14px;font-family:var(--display);font-weight:600;font-size:21px;transition:background .15s}
.field input::placeholder{color:var(--faint)}
.field em{position:absolute;right:12px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--muted);pointer-events:none}
.done .field input{background:var(--okbg)}
.check{width:44px;height:44px;border-radius:50%;border:2px solid var(--line);background:none;color:transparent;font-size:18px;display:flex;align-items:center;justify-content:center;transition:all .15s}
.check[aria-pressed="true"]{background:var(--ok);border-color:var(--ok);color:#fff}
.exfoot{display:flex;gap:4px;margin:2px -8px -6px}
.ghost{background:none;border:0;color:var(--muted);font-size:14px;font-weight:500;padding:8px;border-radius:8px}
.ghost:active{background:var(--sunk)}

textarea{width:100%;border:0;background:var(--surface);border-radius:var(--r);padding:14px 16px;resize:vertical;min-height:70px}
.primary{width:100%;height:54px;border:0;border-radius:var(--r);background:var(--ink);color:var(--bg);font-weight:600;font-size:17px}
.primary.accent{background:var(--accent);color:#fff}
.textlink{background:none;border:0;color:var(--muted);font-size:14px;text-decoration:underline;text-underline-offset:3px;padding:8px 0}
.center{text-align:center}

/* cardio */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--sunk);border-radius:999px;padding:8px 14px;font-size:14px;font-weight:500;color:var(--muted)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg)}
.big{font-family:var(--display);font-weight:700;font-size:76px;line-height:1;text-align:center;letter-spacing:.01em;margin:6px 0 2px;font-variant-numeric:tabular-nums}
.phase{text-align:center;font-size:15px;color:var(--muted);min-height:22px}
.phase.work{color:var(--accent);font-weight:600}
.bar{height:4px;background:var(--sunk);border-radius:2px;overflow:hidden;margin:14px 0}
.bar i{display:block;height:100%;width:0;background:var(--accent);transition:width .25s linear}
.row2{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.row3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.lab{display:block;font-size:13px;color:var(--muted);margin-bottom:6px}
.btnpair{display:grid;grid-template-columns:2fr 1fr;gap:8px}
.secondary{height:54px;border:0;border-radius:var(--r);background:var(--sunk);font-weight:600;font-size:16px}

/* progress */
h2{font-family:var(--display);font-weight:700;font-size:46px;line-height:1;margin:0 0 18px}
h3.sec{font-size:15px;font-weight:600;color:var(--muted);margin:24px 2px 8px}
.stats{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.stat b{display:block;font-family:var(--display);font-weight:700;font-size:32px;line-height:1.05}
.stat span{font-size:13px;color:var(--muted)}
.heat{display:grid;grid-template-rows:repeat(7,1fr);grid-auto-flow:column;grid-auto-columns:1fr;gap:4px}
.cell{aspect-ratio:1;border-radius:4px;background:var(--sunk)}
.cell.push{background:var(--push)} .cell.pull{background:var(--pull)} .cell.legs{background:var(--legs)} .cell.cardio{background:var(--cardio)}
.cell.both{box-shadow:inset 0 -4px 0 var(--cardio)}
.cell.today{outline:2px solid var(--ink);outline-offset:1px}
.legend{display:flex;flex-wrap:wrap;gap:6px 14px;font-size:13px;color:var(--muted);margin-top:12px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:3px;margin-right:5px}
.chartbox{position:relative;height:210px}
select{width:100%;height:44px;border:0;background:var(--sunk);border-radius:12px;padding:0 12px;margin-bottom:12px;-webkit-appearance:none;appearance:none;background-image:linear-gradient(45deg,transparent 50%,var(--muted) 50%),linear-gradient(135deg,var(--muted) 50%,transparent 50%);background-position:calc(100% - 18px) 19px,calc(100% - 13px) 19px;background-size:5px 5px;background-repeat:no-repeat}
.meta{display:flex;justify-content:space-between;font-size:13px;color:var(--muted);margin-top:10px}
.rows{list-style:none;margin:0;padding:0}
.rows li{display:flex;justify-content:space-between;gap:12px;padding:10px 0;font-size:15px}
.rows li+li{border-top:1px solid var(--line)}
.rows li span{color:var(--muted);text-align:right}

/* history */
.hhead{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
.htitle{font-weight:600;font-size:18px;display:flex;align-items:center;gap:8px}
.htitle i{width:9px;height:9px;border-radius:50%}
.hdate{font-size:14px;color:var(--muted)}
.hnote{font-size:14px;color:var(--muted);margin:4px 0 2px}
.empty{background:var(--surface);border-radius:var(--r);padding:28px 20px;text-align:center;color:var(--muted)}

/* settings */
.setting{display:flex;justify-content:space-between;align-items:center;gap:14px;padding:12px 0}
.setting+.setting,.setting+.chips,.chips+.setting{border-top:1px solid var(--line)}
.chips+.setting{margin-top:12px}
.setting p{margin:0}
.setting small{display:block;color:var(--muted);font-size:13px}
.switch{width:50px;height:30px;border-radius:999px;border:0;background:var(--line);position:relative;flex:none;transition:background .15s}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.25)}
.switch[aria-checked="true"]{background:var(--ok)}
.switch[aria-checked="true"]::after{transform:translateX(20px)}
.num{width:68px;height:40px;border:0;background:var(--sunk);border-radius:10px;text-align:center;font-family:var(--display);font-weight:600;font-size:20px}
.inp{width:100%;height:44px;border:0;background:var(--sunk);border-radius:12px;padding:0 12px;font-family:var(--display);font-weight:600;font-size:20px}
.plategrid{display:grid;grid-template-columns:1fr 1fr;gap:8px 18px;margin-top:6px}
.plategrid label{display:flex;justify-content:space-between;align-items:center;font-size:15px}
.btn{height:42px;border-radius:12px;border:0;background:var(--sunk);padding:0 16px;font-weight:600;font-size:15px}
.btn.danger{color:var(--accent)}
.btnrow{display:flex;gap:8px;flex-wrap:wrap}
.note{font-size:13px;color:var(--muted);margin:8px 0 0}

/* nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;background:var(--surface);padding-bottom:env(safe-area-inset-bottom,0px);z-index:3;box-shadow:0 -1px 0 var(--line)}
.tabsin{max-width:540px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--nav)}
.tab{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:11px;font-weight:500;color:var(--faint)}
.tab svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}
.tab[aria-current="page"]{color:var(--ink)}

/* rest timer */
.timer{position:fixed;left:12px;right:12px;bottom:calc(var(--nav) + 10px + env(safe-area-inset-bottom,0px));max-width:516px;margin:0 auto;background:var(--ink);color:var(--bg);border-radius:18px;padding:12px 14px 10px;display:none;z-index:2;box-shadow:0 8px 24px rgba(0,0,0,.25)}
.timer.on{display:block}
.tin{display:flex;align-items:center;gap:6px}
.tclock{font-family:var(--display);font-weight:700;font-size:34px;line-height:1;min-width:84px;font-variant-numeric:tabular-nums}
.tlabel{flex:1;font-size:14px;opacity:.7}
.tbtn{background:rgba(127,127,127,.22);border:0;color:inherit;border-radius:10px;height:34px;padding:0 10px;font-size:14px;font-weight:600}
.tprog{height:3px;background:rgba(127,127,127,.3);margin-top:10px;border-radius:2px;overflow:hidden}
.tprog i{display:block;height:100%;background:var(--accent);width:0}
.timer.over .tclock{color:var(--accent)}

/* sheet */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.4);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.sheetbox{background:var(--bg);width:100%;max-width:540px;max-height:88vh;overflow-y:auto;border-radius:22px 22px 0 0;padding:10px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.sheetbox::before{content:"";display:block;width:36px;height:4px;border-radius:2px;background:var(--line);margin:0 auto 14px}
.sheetbox h3{font-family:var(--display);font-weight:700;font-size:30px;margin:0 0 12px}
.sheetbox p{margin:0 0 10px;font-size:15px}
.barviz{display:flex;align-items:center;justify-content:center;height:150px;gap:3px;margin:18px 0 6px}
.barviz .sl{height:12px;background:var(--faint);border-radius:3px}
.plate{width:18px;border-radius:4px;display:flex;align-items:center;justify-content:center;font-family:var(--display);font-weight:700;font-size:12px;color:#1C1E21;writing-mode:vertical-rl}
.p15{height:140px;background:var(--pull)} .p10{height:118px;background:var(--push)} .p5{height:92px;background:var(--legs)}
.p2-5,.p2{height:72px;background:var(--gold)} .p1,.p1-25,.p0-5{height:56px;background:#D9DCE0}
.platenote{text-align:center;font-size:15px}
.erow{background:var(--surface);border-radius:14px;padding:12px;margin-bottom:8px}
.erow input[type=text]{width:100%;height:42px;border:0;background:var(--sunk);border-radius:10px;padding:0 12px;margin-bottom:8px;font-weight:600}
.egrid{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-bottom:8px}
.egrid label{font-size:12px;color:var(--muted)}
.egrid input,.egrid select{width:100%;height:38px;border:0;background:var(--sunk);border-radius:8px;padding:0 8px;margin:3px 0 0;font-size:15px;background-position:calc(100% - 16px) 16px,calc(100% - 11px) 16px}
.eacts{display:flex;justify-content:space-between;align-items:center}

.toast{position:fixed;left:50%;top:calc(12px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 18px;border-radius:999px;font-size:15px;font-weight:500;display:none;z-index:6;max-width:90vw;text-align:center;box-shadow:0 6px 20px rgba(0,0,0,.2)}
.toast.on{display:block}
.toast.pr{background:linear-gradient(90deg,var(--push),var(--pull));color:#1C1E21}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><span class="sub" id="topSub"></span><span class="clock" id="clock"></span></div>
  <main id="main"></main>
</div>

<div class="timer" id="timer" role="timer">
  <div class="tin">
    <div class="tclock" id="tclock">1:30</div>
    <div class="tlabel" id="tlabel">Rest</div>
    <button class="tbtn" data-t="-15">−15</button>
    <button class="tbtn" data-t="15">+15</button>
    <button class="tbtn" data-t="stop">Skip</button>
  </div>
  <div class="tprog"><i id="tprog"></i></div>
</div>

<nav class="tabs" aria-label="Main">
  <div class="tabsin">
    <button class="tab" data-view="log"><svg viewBox="0 0 24 24"><path d="M6 7v10M18 7v10M3 10v4M21 10v4M6 12h12"/></svg>Train</button>
    <button class="tab" data-view="progress"><svg viewBox="0 0 24 24"><path d="M4 19V5M4 19h16M8 15l4-4 3 3 5-6"/></svg>Progress</button>
    <button class="tab" data-view="history"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="8"/><path d="M12 8v4l3 2"/></svg>History</button>
    <button class="tab" data-view="settings"><svg viewBox="0 0 24 24"><path d="M4 7h10M18 7h2M4 17h4M12 17h8"/><circle cx="16" cy="7" r="2"/><circle cx="10" cy="17" r="2"/></svg>Settings</button>
  </div>
</nav>

<div class="sheet" id="sheet" role="dialog" aria-modal="true"><div class="sheetbox" id="sheetBody"></div></div>
<input type="file" id="importFile" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status"></div>

<script>
/* ================= plan ================= */
const DEFAULT_PLAN = {
  push:{name:"Push", ex:[
    {id:"dips",n:"Dips",sets:3,lo:6,hi:12,type:"bw"},
    {id:"dbbench",n:"Dumbbell bench press",sets:4,lo:8,hi:12,type:"db"},
    {id:"ohp",n:"Overhead press",sets:3,lo:6,hi:10,type:"bb"},
    {id:"lateral",n:"Lateral raises",sets:3,lo:12,hi:15,type:"db"},
    {id:"triext",n:"Overhead triceps extension",sets:3,lo:10,hi:12,type:"db"},
    {id:"pushups",n:"Push-ups",sets:1,max:true,type:"bw"}
  ]},
  pull:{name:"Pull", ex:[
    {id:"pullups",n:"Pull-ups",sets:4,max:true,type:"bw"},
    {id:"bbrow",n:"Barbell row",sets:4,lo:8,hi:10,type:"bb"},
    {id:"dbrow",n:"One-arm dumbbell row",sets:3,lo:10,hi:12,type:"db"},
    {id:"chinups",n:"Chin-ups",sets:2,max:true,type:"bw"},
    {id:"bbcurl",n:"Barbell curl",sets:3,lo:8,hi:12,type:"bb"},
    {id:"hammer",n:"Hammer curl",sets:2,lo:10,hi:12,type:"db"}
  ]},
  legs:{name:"Legs", ex:[
    {id:"rdl",n:"Romanian deadlift",sets:4,lo:8,hi:10,type:"bb"},
    {id:"bss",n:"Bulgarian split squat",sets:3,lo:8,hi:12,type:"db"},
    {id:"goblet",n:"Goblet or front squat",sets:3,lo:10,hi:12,type:"db"},
    {id:"sissy",n:"Sissy squat (hold doorframe)",sets:3,lo:8,hi:15,type:"bw"},
    {id:"slidecurl",n:"Sliding leg curl (socks on floor)",sets:3,lo:8,hi:12,type:"bw"},
    {id:"calf",n:"Stair calf raises",sets:4,lo:15,hi:20,type:"bw"},
    {id:"stairs",n:"Stair sprints or step-ups",sets:5,max:true,type:"bw",unit:"rounds"}
  ]}
};
const ORDER = ["push","pull","legs"];
const TABS = ["push","pull","legs","cardio"];
const LEGACY = {legext:"Leg extension", legcurl:"Leg curl"};
const ACTIVITIES = [["bike","Bike"],["stairs","Stairs"],["run","Run"],["walk","Walk"],["other","Other"]];
const actName = k => (ACTIVITIES.find(a => a[0] === k) || [k, "Cardio"])[1];

/* ================= state ================= */
const KEY = "ppl-log-v2", OLDKEY = "ppl-log-v1";
const clone = o => JSON.parse(JSON.stringify(o));
function defSettings(){ return {rest:90, autoRest:true, theme:"auto", notif:false, sound:true, countdown:true, vibrate:true, wake:true, weekGoal:3, bar:10, plates:{"15":2,"10":2,"5":2,"2":0,"1":8}}; }
function defaults(){ return {v:2, plan:clone(DEFAULT_PLAN), sessions:[], draft:{}, day:"push", next:"push", settings:defSettings()}; }
function load(){
  let s = null; try{ s = JSON.parse(localStorage.getItem(KEY)); }catch(e){}
  const d = defaults();
  if(s && s.v === 2){ Object.assign(d, s); d.settings = Object.assign(defSettings(), s.settings || {}); if(!d.next) d.next = ORDER.includes(d.day) ? d.day : "push"; return d; }
  try{
    const o = JSON.parse(localStorage.getItem(OLDKEY));
    if(o && Array.isArray(o.sessions)){ d.sessions = o.sessions; d.day = d.next = o.day || "push"; d.settings.rest = o.rest || 90;
      for(const k in (o.draft || {})) d.draft[k] = {start:null, ex:o.draft[k], note:""}; }
  }catch(e){}
  return d;
}
let state = load();
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){ toast("Couldn't save. Storage is full or blocked."); } }
let view = "log";

/* ================= helpers ================= */
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };
const e1rm = (w, r) => w * (1 + r / 30);
const round1 = n => Math.round(n * 10) / 10;
const css = v => getComputedStyle(document.documentElement).getPropertyValue(v).trim();
const dayName = k => k === "cardio" ? "Cardio" : (state.plan[k] ? state.plan[k].name : k);
function exById(id){ for(const k of ORDER){ const e = state.plan[k].ex.find(x => x.id === id); if(e) return e; } return {id, n:LEGACY[id] || id, type:"db"}; }
const isBW = e => e.type === "bw";
function dateKey(d){ d = new Date(d); return d.getFullYear() + "-" + (d.getMonth()+1) + "-" + d.getDate(); }
function weekStart(d){ d = new Date(d); d.setHours(0,0,0,0); d.setDate(d.getDate() - (d.getDay() + 6) % 7); return d; }
function fmtDur(ms){ const s = Math.max(0, Math.floor(ms/1000)), h = Math.floor(s/3600), m = Math.floor(s%3600/60), x = s%60;
  return (h ? h + ":" + String(m).padStart(2,"0") : m) + ":" + String(x).padStart(2,"0"); }
const fmtDate = iso => new Date(iso).toLocaleDateString(undefined, {weekday:"short", day:"numeric", month:"short"});
function setsText(e, sets){
  const w = sets[0].w, same = sets.every(s => s.w === w);
  const wt = w ? (isBW(e) ? "+" + w : w) + " kg × " : "";

function lastFor(id){ for(let i = state.sessions.length - 1; i >= 0; i--){ const s = (state.sessions[i].ex || {})[id]; if(s && s.length) return s; } return null; }

  for(const s of state.sessions) for(const set of ((s.ex || {})[id] || [])){
    const score = set.w ? e1rm(set.w, set.r) : set.r;

/* ================= sound + vibration ================= */
// Pre-rendered WAV clips play through the media channel, which Android handles more reliably than WebAudio.
function wav(tones){
  const sr = 22050, parts = tones.map(([f, ms]) => Math.floor(sr * ms / 1000)), n = parts.reduce((a,b) => a+b, 0);
  const buf = new ArrayBuffer(44 + n*2), v = new DataView(buf), str = (o, s) => { for(let i = 0; i < s.length; i++) v.setUint8(o+i, s.charCodeAt(i)); };
  str(0,"RIFF"); v.setUint32(4, 36 + n*2, true); str(8,"WAVE"); str(12,"fmt "); v.setUint32(16,16,true); v.setUint16(20,1,true); v.setUint16(22,1,true);
  v.setUint32(24,sr,true); v.setUint32(28,sr*2,true); v.setUint16(32,2,true); v.setUint16(34,16,true); str(36,"data"); v.setUint32(40,n*2,true);
  let o = 44;
  tones.forEach(([f], ti) => { const len = parts[ti];
    for(let i = 0; i < len; i++){ const env = f ? Math.min(1, i/150, (len-i)/300) : 0; v.setInt16(o, Math.sin(2*Math.PI*f*i/sr) * .7 * env * 32767, true); o += 2; } });
  return URL.createObjectURL(new Blob([buf], {type:"audio/wav"}));
}
const SOUNDS = {
  done: wav([[880,170],[0,90],[880,170],[0,90],[1175,320]]),
  tick: wav([[660,80]]),
  work: wav([[988,140],[0,70],[1319,260]]),
  rest: wav([[523,380]])
};
const players = {};
for(const k in SOUNDS){ players[k] = new Audio(SOUNDS[k]); players[k].preload = "auto"; }
let unlocked = false;
function unlockAudio(){
  if(unlocked) return; unlocked = true;
  for(const k in players){ const a = players[k]; a.muted = true; a.play().then(() => { a.pause(); a.currentTime = 0; a.muted = false; }).catch(() => { a.muted = false; unlocked = false; }); }
}
document.addEventListener("pointerdown", unlockAudio, {capture:true});
function play(k){
  if(!state.settings.sound) return Promise.resolve(false);
  const a = players[k]; a.muted = false; a.currentTime = 0;
  return a.play().then(() => true).catch(() => fallbackBeep(k));
}
let actx = null;
function fallbackBeep(k){
  try{
    actx = actx || new (window.AudioContext || window.webkitAudioContext)(); actx.resume();
    const o = actx.createOscillator(), g = actx.createGain(), t = actx.currentTime;
    o.frequency.value = k === "rest" ? 523 : 880; o.connect(g); g.connect(actx.destination);
    g.gain.setValueAtTime(.0001, t); g.gain.exponentialRampToValueAtTime(.4, t+.02); g.gain.exponentialRampToValueAtTime(.0001, t+.3);
    o.start(t); o.stop(t+.32); return true;
  }catch(e){ return false; }
}
function buzz(pattern){
  if(!state.settings.vibrate || !("vibrate" in navigator)) return false;
  try{ return navigator.vibrate(pattern); }catch(e){ return false; }
}
async function notify(title, body, force){
  const st = state.settings;
  if(!st.notif || !("Notification" in window) || Notification.permission !== "granted") return false;
  if(!document.hidden && !force) return false;
  try{
    const reg = await navigator.serviceWorker?.getRegistration();
    const opts = {body, icon:"icon-192.png", badge:"icon-192.png", tag:"ppl", renotify:true, vibrate:[300,120,300]};
    if(reg) await reg.showNotification(title, opts); else new Notification(title, opts);
    return true;
  }catch(e){ return false; }
}
function signal(kind){
  if(kind === "done"){ play("done"); buzz([300,120,300,120,500]); notify("Rest is over", "Time for your next set."); }
  else if(kind === "tick"){ if(state.settings.countdown){ play("tick"); buzz(60); } }
  else if(kind === "work"){ play("work"); buzz([200,80,200]); notify("Go", "Work interval started."); }
  else if(kind === "rest"){ play("rest"); buzz(400); }
  else if(kind === "finish"){ play("done"); buzz([300,120,300,120,500]); notify("Intervals done", "Nice work. Save your cardio."); }
}

function draftFor(day){
  let d = state.draft[day];
  if(!d || !d.ex) d = state.draft[day] = {start:null, ex:{}, note:""};
  state.plan[day].ex.forEach(e => { if(!d.ex[e.id]) d.ex[e.id] = Array.from({length:e.sets}, () => ({w:"", r:"", d:false})); });
  return d;
}
function ensureStart(){ const d = draftFor(state.day); if(!d.start){ d.start = Date.now(); save(); wake(true); renderTop(); } }
function cdraft(){
  if(!state.draft.cardio) state.draft.cardio = {type:"bike", mode:"free", elapsed:0, runStart:null, manual:"", dist:"", level:"", effort:"", note:"", work:30, rest:60, rounds:8};
  return state.draft.cardio;
}
const cElapsed = c => c.elapsed + (c.runStart ? Date.now() - c.runStart : 0);

/* ================= cardio ================= */
let lastPhase = null, lastTick = -1;
function intervalState(c){
  const t = Math.floor(cElapsed(c) / 1000), cyc = c.work + c.rest, total = c.rounds * cyc - c.rest;
  if(t >= total) return {done:true, round:c.rounds, total};
  const round = Math.floor(t / cyc) + 1, inC = t % cyc, work = inC < c.work;
  return {done:false, round, work, left: work ? c.work - inC : cyc - inC, len: work ? c.work : c.rest, total, t};
}
function renderCardio(){
  const c = cdraft(), running = !!c.runStart, started = running || c.elapsed > 0;

    <div class="card"><span class="lab">Activity</span><div class="chips">${ACTIVITIES.map(([k,l]) => `<button class="chip" data-act="ctype" data-val="${k}" aria-pressed="${c.type === k}">${l}</button>`).join("")}</div></div>

      <div class="btnpair"><button class="primary${running ? "" : " accent"}" data-act="cgo">${running ? "Pause" : started ? "Resume" : "Start"}</button><button class="secondary" data-act="creset" ${started ? "" : "disabled"}>Reset</button></div>
    </div>

      <div class="row2">
        <label><span class="lab">Minutes (or use the timer)</span><input class="inp" inputmode="decimal" data-c="manual" value="${esc(c.manual)}" placeholder="${started ? Math.round(cElapsed(c)/60000) : "–"}"></label>
        ${["bike","run","walk"].includes(c.type) ? `<label><span class="lab">Distance (km)</span><input class="inp" inputmode="decimal" data-c="dist" value="${esc(c.dist)}" placeholder="–"></label>` : `<label><span class="lab">${c.type === "stairs" ? "Floors or rounds" : "Distance (km)"}</span><input class="inp" inputmode="decimal" data-c="dist" value="${esc(c.dist)}" placeholder="–"></label>`}
      </div>
      ${c.type === "bike" ? `<label style="display:block;margin-top:10px"><span class="lab">Resistance level</span><input class="inp" inputmode="numeric" data-c="level" value="${esc(c.level)}" placeholder="–"></label>` : ""}

      <div class="chips">${[["easy","Easy"],["moderate","Moderate"],["hard","Hard"]].map(([k,l]) => `<button class="chip" data-act="ceffort" data-val="${k}" aria-pressed="${c.effort === k}">${l}</button>`).join("")}</div>
    </div>
    <textarea data-c="note" rows="2" placeholder="Notes">${esc(c.note)}</textarea>

function updateCardio(){
  const c = state.draft.cardio; if(!c || view !== "log" || state.day !== "cardio" || !$("cTime")) return;
  const ms = cElapsed(c);
  if(c.mode === "intervals"){
    const s = intervalState(c);
    if(s.done){
      $("cTime").textContent = fmtDur(s.total * 1000); $("cPhase").textContent = "All " + c.rounds + " rounds done"; $("cPhase").className = "phase"; $("cBar").style.width = "100%";
      if(c.runStart){ c.elapsed = s.total * 1000; c.runStart = null; save(); signal("finish"); wake(false); lastPhase = null; renderCardio(); }
      return;
    }
    $("cTime").textContent = fmtDur(s.left * 1000);
    $("cPhase").textContent = (s.work ? "Work" : "Rest") + ", round " + s.round + " of " + c.rounds + ", total " + fmtDur(ms);
    $("cPhase").className = "phase" + (s.work && c.runStart ? " work" : "");
    $("cBar").style.width = ((1 - s.left / s.len) * 100) + "%";
    if(c.runStart){
      const key = s.round + (s.work ? "w" : "r");
      if(lastPhase !== null && key !== lastPhase) signal(s.work ? "work" : "rest");
      lastPhase = key;
      if(s.left <= 3 && s.left >= 1 && lastTick !== s.t){ lastTick = s.t; signal("tick"); }
    }
  } else {
    $("cTime").textContent = fmtDur(ms);
    $("cPhase").textContent = c.runStart ? "Running" : ms ? "Paused" : "";
    $("cPhase").className = "phase";
    $("cBar").style.width = ((ms / 60000) % 1 * 100) + "%";
  }
}
setInterval(updateCardio, 250);

function cardioAction(act, val){
  const c = cdraft();
  switch(act){
    case "ctype": c.type = val; save(); renderCardio(); break;
    case "cmode": if(c.runStart || c.elapsed){ toast("Reset the timer to switch modes"); return; } c.mode = val; save(); renderCardio(); break;
    case "ceffort": c.effort = c.effort === val ? "" : val; save(); renderCardio(); break;
    case "cgo":
      if(c.runStart){ c.elapsed = cElapsed(c); c.runStart = null; wake(false); }
      else {
        if(c.mode === "intervals"){
          c.work = Math.max(5, c.work || 30); c.rest = Math.max(0, c.rest ?? 60); c.rounds = Math.max(1, c.rounds || 8);
          if(intervalState(c).done) c.elapsed = 0;
          if(!c.elapsed){ lastPhase = null; signal("work"); }
        }
        c.runStart = Date.now(); wake(true);
      }
      save(); renderCardio(); renderTop(); break;
    case "creset": if(confirm("Reset the timer to zero?")){ c.elapsed = 0; c.runStart = null; lastPhase = null; save(); wake(false); renderCardio(); renderTop(); } break;
    case "csave": {
      const mins = num(c.manual);
      const dur = mins ? mins * 60000 : cElapsed(c);
      if(dur < 60000){ toast("Log at least 1 minute first"); return; }
      state.sessions.push({id:Date.now().toString(36), day:"cardio", date:new Date().toISOString(), dur, note:(c.note || "").trim(), ex:{},
        cardio:{type:c.type, dist:num(c.dist), level:num(c.level), effort:c.effort || null, intervals: c.mode === "intervals" && !mins ? {work:c.work, rest:c.rest, rounds:c.rounds} : null}});
      const keep = {type:c.type, mode:c.mode, work:c.work, rest:c.rest, rounds:c.rounds};
      delete state.draft.cardio; Object.assign(cdraft(), keep);
      wake(false); stopTimer(); save(); view = "progress"; render(); window.scrollTo(0,0); toast(actName(c.type) + " saved, " + Math.round(dur/60000) + " min");
    }
  }
}

/* ================= progress ================= */
let charts = [], progEx = null;

function streak(){
  const goal = state.settings.weekGoal, S = strength(); let ws = weekStart(new Date()), n = 0;
  const cnt = w => S.filter(s => inWeek(s, w)).length;
  if(cnt(ws) < goal) ws.setDate(ws.getDate() - 7);
  while(cnt(ws) >= goal){ n++; ws.setDate(ws.getDate() - 7); }
  return n;
}

      <div class="chartbox"><canvas id="exChart"></canvas></div><div class="meta" id="exMeta"></div></div>

function drawWeekly(id, keys, val){

function tick(btn, exId){

    ensureStart(); buzz(30);
    const w = num(s.w) || 0, r = parseInt(s.r) || 0, best = bestFor(exId);
    if(best && r > 0 && (w ? e1rm(w, r) : r) > best.score + .01) toast("New best on " + e.n + ": " + (w ? w + " kg × " + r : r + " " + (e.unit || "reps")), true);

  delete state.draft[day];

/* ================= rest timer ================= */
let tEnd = 0, tLen = 90, tInt = null, alerted = false, lastCount = -1;
function startTimer(){ tLen = state.settings.rest; tEnd = Date.now() + tLen*1000; alerted = false; lastCount = -1; $("timer").classList.add("on"); tickTimer(); clearInterval(tInt); tInt = setInterval(tickTimer, 200); }
function stopTimer(){ clearInterval(tInt); tInt = null; $("timer").classList.remove("on","over"); }
function tickTimer(){
  const ms = tEnd - Date.now(), left = Math.ceil(ms / 1000), a = Math.abs(left);
  $("tclock").textContent = (ms < 0 ? "+" : "") + Math.floor(a/60) + ":" + String(a%60).padStart(2,"0");
  $("tlabel").textContent = ms > 0 ? "Rest" : "Go";
  $("tprog").style.width = Math.min(100, Math.max(0, (1 - ms/(tLen*1000)) * 100)) + "%";
  $("timer").classList.toggle("over", ms <= 0);
  if(ms > 0 && left <= 3 && left !== lastCount && !document.hidden){ lastCount = left; signal("tick"); }
  if(ms <= 0 && !alerted){ alerted = true; signal("done"); }
}
document.querySelectorAll("[data-t]").forEach(b => b.onclick = () => {
  const t = b.dataset.t; if(t === "stop") return stopTimer();
  tEnd += (+t) * 1000; tLen = Math.max(tLen, Math.ceil((tEnd - Date.now())/1000)); if(tEnd > Date.now()){ alerted = false; lastCount = -1; } tickTimer();
});
document.addEventListener("visibilitychange", () => {
  if(document.hidden) return;
  if(tInt) tickTimer();
  const d = state.draft[state.day], c = state.draft.cardio;
  if((d && d.start) || (c && c.runStart)) wake(true);
});

function plateMath(total){
  const st = state.settings; let per = (total - st.bar) / 2;
  if(per < 0) return {err:"That's less than the empty bar (" + st.bar + " kg)."};
  const out = [];
  for(const s of Object.keys(st.plates).map(Number).sort((a,b) => b-a)){ let n = Math.floor((st.plates[s] || 0) / 2); while(n > 0 && per >= s - 1e-9){ out.push(s); per -= s; n--; } }
  return {out, left:round1(per*2)};
}
function plateHTML(total){
  if(total === null) return '<p class="platenote">Type a weight above.</p>';
  const r = plateMath(total); if(r.err) return `<p class="platenote">${r.err}</p>`;
  const side = r.out.map(p => `<div class="plate p${String(p).replace(".","-")}">${p}</div>`);
  let h = `<div class="barviz"><div class="sl" style="width:24px"></div>${[...side].reverse().join("")}<div class="sl" style="width:70px;height:7px"></div>${side.join("")}<div class="sl" style="width:24px"></div></div>`;
  h += `<p class="platenote">${r.out.length ? "Each side: " + r.out.join(" + ") + " kg" : "Just the bar"}</p>`;
  if(r.left > 0) h += `<p class="platenote" style="color:var(--accent)">Your plates can't make this exactly. Closest is ${round1(total - r.left)} kg.</p>`;
  return h;
}
