<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="PPL Log">
<meta name="theme-color" content="#1A1C1F">
<title>PPL Log</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#ECEAE5; --surface:#FFFFFF; --sunk:#F4F2EE; --ink:#1D1F22; --muted:#686C72;
  --line:#D5D2CB; --iron:#2A2D32; --steel:#8F959C; --red:#C42F28; --ok:#2E7A4C; --okbg:#E3F1E8;
  --display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --body:"Barlow",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --bg:#15171A; --surface:#1F2226; --sunk:#181A1D; --ink:#ECEEF0; --muted:#979DA4;
    --line:#32363C; --iron:#E6E8EA; --steel:#6E747B; --red:#E2493F; --ok:#5BBE85; --okbg:#1C3327;
  }
}
:root[data-theme="dark"]{
  --bg:#15171A; --surface:#1F2226; --sunk:#181A1D; --ink:#ECEEF0; --muted:#979DA4;
  --line:#32363C; --iron:#E6E8EA; --steel:#6E747B; --red:#E2493F; --ok:#5BBE85; --okbg:#1C3327;
}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*,*::before,*::after{box-sizing:inherit}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.wrap{max-width:560px;margin:0 auto;padding:16px 14px 140px}

header{display:flex;align-items:flex-end;justify-content:space-between;gap:12px;margin:6px 2px 14px}
.brand{font-family:var(--display);font-weight:700;font-size:15px;letter-spacing:.02em;color:var(--muted)}
.hbtns{display:flex;gap:6px}
.ghost{background:none;border:1px solid var(--line);border-radius:999px;padding:6px 12px;font-size:14px;color:var(--muted)}
.ghost[aria-pressed="true"]{border-color:var(--ink);color:var(--ink)}

.days{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:18px}
.day{background:none;border:0;padding:4px 0 10px;text-align:left;border-bottom:3px solid var(--line)}
.day span{display:block;font-family:var(--display);font-weight:700;font-size:clamp(38px,12vw,56px);line-height:.95;color:var(--steel);transition:color .15s}
.day small{display:block;font-size:13px;color:var(--muted);margin-top:4px}
.day[aria-selected="true"]{border-bottom-color:var(--red)}
.day[aria-selected="true"] span{color:var(--ink)}

.ex{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:14px 14px 10px;margin-bottom:12px}
.exhead{display:flex;justify-content:space-between;align-items:baseline;gap:10px}
.exname{font-family:var(--display);font-weight:600;font-size:24px;line-height:1.1;margin:0}
.target{font-family:var(--display);font-weight:500;font-size:18px;color:var(--muted);white-space:nowrap}
.hint{font-size:14px;color:var(--muted);margin:4px 0 10px}
.hint.up{color:var(--ok);font-weight:600}
.setrow{display:grid;grid-template-columns:28px 1fr 1fr 48px;gap:8px;align-items:center;margin-bottom:8px}
.setno{font-family:var(--display);font-weight:600;font-size:18px;color:var(--steel);text-align:center}
.field{position:relative}
.field input{width:100%;height:46px;border:1px solid var(--line);background:var(--sunk);border-radius:10px;padding:0 34px 0 12px;font-family:var(--display);font-weight:600;font-size:22px}
.field input::placeholder{color:var(--steel);font-weight:500}
.field em{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-style:normal;font-size:13px;color:var(--muted);pointer-events:none}
.check{height:46px;border-radius:10px;border:1px solid var(--line);background:var(--sunk);font-size:20px;color:var(--steel)}
.check[aria-pressed="true"]{background:var(--okbg);border-color:var(--ok);color:var(--ok)}
.setrow.done input{border-color:var(--ok)}
.addset{background:none;border:0;color:var(--muted);font-size:14px;padding:4px 2px 6px}

.finish{width:100%;height:56px;border:0;border-radius:14px;background:var(--red);color:#fff;font-family:var(--display);font-weight:700;font-size:24px;margin-top:6px}
.note{font-size:13px;color:var(--muted);text-align:center;margin:12px 6px 0}

.hist h2{font-family:var(--display);font-weight:700;font-size:40px;margin:4px 0 14px;line-height:1}
.sess{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:12px 14px;margin-bottom:10px}
.sesstop{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.sessday{font-family:var(--display);font-weight:700;font-size:24px}
.sessdate{font-size:14px;color:var(--muted)}
.sess ul{list-style:none;margin:0;padding:0;font-size:15px}
.sess li{display:flex;justify-content:space-between;gap:10px;padding:3px 0;border-top:1px solid var(--line)}
.sess li:first-child{border-top:0}
.sess li b{font-weight:500}
.sess li span{color:var(--muted);text-align:right}
.del{background:none;border:0;color:var(--muted);font-size:13px;padding:6px 0 0;text-decoration:underline}
.empty{background:var(--surface);border:1px dashed var(--line);border-radius:14px;padding:22px;text-align:center;color:var(--muted)}

.timer{position:fixed;left:0;right:0;bottom:0;padding:10px 14px calc(10px + env(safe-area-inset-bottom,0px));background:var(--iron);color:var(--bg);display:none}
.timer.on{display:block}
.tin{max-width:560px;margin:0 auto;display:flex;align-items:center;gap:10px}
.tclock{font-family:var(--display);font-weight:700;font-size:38px;min-width:92px;line-height:1}
.tlabel{flex:1;font-size:14px;opacity:.75}
.tbtn{background:none;border:1px solid currentColor;color:inherit;border-radius:999px;padding:6px 11px;font-size:14px;opacity:.9}
.timer.over .tclock{color:var(--red)}

.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);display:none;align-items:flex-end;justify-content:center;z-index:5}
.sheet.on{display:flex}
.sheetbox{background:var(--surface);width:100%;max-width:560px;border-radius:18px 18px 0 0;padding:20px 18px calc(24px + env(safe-area-inset-bottom,0px))}
.sheetbox h3{font-family:var(--display);font-weight:700;font-size:28px;margin:0 0 10px}
.sheetbox p{margin:0 0 10px;font-size:15px}
.sheetbox .ghost{margin-top:6px}
.restpick{display:flex;gap:6px;flex-wrap:wrap;margin:6px 0 12px}

.toast{position:fixed;left:50%;top:calc(14px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--iron);color:var(--bg);padding:10px 16px;border-radius:999px;font-size:15px;display:none;z-index:6}
.toast.on{display:block}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="brand">Basement PPL</div>
    <div class="hbtns">
      <button class="ghost" id="tabLog" aria-pressed="true">Log</button>
      <button class="ghost" id="tabHist" aria-pressed="false">History</button>
      <button class="ghost" id="openHelp">Settings</button>
    </div>
  </header>
  <main id="main"></main>
</div>

<div class="timer" id="timer" role="timer" aria-live="off">
  <div class="tin">
    <div class="tclock" id="tclock">1:30</div>
    <div class="tlabel" id="tlabel">Rest</div>
    <button class="tbtn" id="tminus">−15</button>
    <button class="tbtn" id="tplus">+15</button>
    <button class="tbtn" id="tskip">Done</button>
  </div>
</div>

<div class="sheet" id="sheet" role="dialog" aria-modal="true" aria-labelledby="sheetTitle">
  <div class="sheetbox">
    <h3 id="sheetTitle">Settings</h3>
    <p><strong>Rest time</strong> after you tick a set:</p>
    <div class="restpick" id="restpick"></div>
    <p><strong>Add to home screen.</strong> On Android in Chrome, tap the ⋮ menu, then "Add to Home screen". On iPhone in Safari, tap Share, then "Add to Home Screen".</p>
    <p>Your logs save in this browser on this phone. Clearing browser data deletes them.</p>
    <button class="ghost" id="closeHelp">Close</button>
  </div>
</div>

<div class="toast" id="toast" role="status"></div>

<script>
const PLAN = {
  push:{name:"Push", ex:[
    {id:"dips",n:"Dips",sets:3,lo:6,hi:12,bw:true},
    {id:"dbbench",n:"Dumbbell bench press",sets:4,lo:8,hi:12},
    {id:"ohp",n:"Overhead press",sets:3,lo:6,hi:10},
    {id:"lateral",n:"Lateral raises",sets:3,lo:12,hi:15},
    {id:"triext",n:"Overhead triceps extension",sets:3,lo:10,hi:12},
    {id:"pushups",n:"Push-ups",sets:1,max:true,bw:true}
  ]},
  pull:{name:"Pull", ex:[
    {id:"pullups",n:"Pull-ups",sets:4,max:true,bw:true},
    {id:"bbrow",n:"Barbell row",sets:4,lo:8,hi:10},
    {id:"dbrow",n:"One-arm dumbbell row",sets:3,lo:10,hi:12,note:"per side"},
    {id:"chinups",n:"Chin-ups",sets:2,max:true,bw:true},
    {id:"bbcurl",n:"Barbell curl",sets:3,lo:8,hi:12},
    {id:"hammer",n:"Hammer curl",sets:2,lo:10,hi:12}
  ]},
  legs:{name:"Legs", ex:[
    {id:"rdl",n:"Romanian deadlift",sets:4,lo:8,hi:10},
    {id:"bss",n:"Bulgarian split squat",sets:3,lo:8,hi:12,note:"per leg"},
    {id:"goblet",n:"Goblet or front squat",sets:3,lo:10,hi:12},
    {id:"sissy",n:"Sissy squat (hold doorframe)",sets:3,lo:8,hi:15,bw:true},
    {id:"slidecurl",n:"Sliding leg curl (socks on floor)",sets:3,lo:8,hi:12,bw:true},
    {id:"calf",n:"Stair calf raises",sets:4,lo:15,hi:20,bw:true},
    {id:"stairs",n:"Stair sprints or step-ups",sets:5,max:true,bw:true,unit:"rounds"}
  ]}
};

const KEY = "ppl-log-v1";
function load(){
  try{ const s = JSON.parse(localStorage.getItem(KEY)); if(s && Array.isArray(s.sessions)) return Object.assign({draft:{},rest:90,day:"push"},s); }catch(e){}
  return {sessions:[],draft:{},rest:90,day:"push"};
}
function save(){ try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){} }
let state = load();
let view = "log";

const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const num = v => { const n = parseFloat(String(v).replace(",", ".")); return isNaN(n) ? null : n; };

function lastFor(exId){
  for(let i = state.sessions.length - 1; i >= 0; i--){
    const sets = state.sessions[i].ex[exId];
    if(sets && sets.length) return sets;
  }
  return null;
}
function draftFor(day){
  if(!state.draft[day]) state.draft[day] = {};
  const d = state.draft[day];
  PLAN[day].ex.forEach(e => { if(!d[e.id]) d[e.id] = Array.from({length:e.sets}, () => ({w:"",r:"",d:false})); });
  return d;
}
function targetText(e){
  if(e.max) return e.sets + " × max";
  return e.sets + " × " + e.lo + "–" + e.hi;
}
function hintFor(e, last){
  if(!last) return {t:"No log yet. Pick a weight where you hit " + (e.max ? "a hard set." : e.lo + " reps."), up:false};
  const reps = last.map(s => s.r).join(", ");
  const w = last[0].w;
  const wTxt = w ? (e.bw ? "+" + w + " kg" : w + " kg") + " × " : "";
  if(!e.max && last.length >= e.sets && last.every(s => s.r >= e.hi)){
    return {t:"Last: " + wTxt + reps + ". You hit the top. Add 1–2 kg.", up:true};
  }
  if(e.max){
    const total = last.reduce((a,s) => a + (s.r||0), 0);
    return {t:"Last: " + wTxt + reps + ". Beat " + total + " total " + (e.unit || "reps") + ".", up:false};
  }
  return {t:"Last: " + wTxt + reps + ".", up:false};
}

function renderLog(){
  const day = state.day, d = draftFor(day);
  let h = '<div class="days" role="tablist">';
  for(const k of Object.keys(PLAN)){
    const n = state.sessions.filter(s => s.day === k).length;
    h += `<button class="day" role="tab" data-day="${k}" aria-selected="${k===day}"><span>${PLAN[k].name}</span><small>${n ? n + " done" : "Not started"}</small></button>`;
  }
  h += "</div>";
  PLAN[day].ex.forEach(e => {
    const hint = hintFor(e, lastFor(e.id));
    const last = lastFor(e.id);
    h += `<section class="ex" data-ex="${e.id}">
      <div class="exhead"><h3 class="exname">${esc(e.n)}</h3><div class="target">${targetText(e)}${e.note ? " " + e.note : ""}</div></div>
      <p class="hint${hint.up ? " up" : ""}">${esc(hint.t)}</p>`;
    d[e.id].forEach((s, i) => {
      const pw = last && last[i] ? last[i].w : (last ? last[0].w : "");
      const pr = last && last[i] ? last[i].r : "";
      h += `<div class="setrow${s.d ? " done" : ""}" data-i="${i}">
        <div class="setno">${i+1}</div>
        <label class="field"><input inputmode="decimal" data-k="w" value="${esc(s.w)}" placeholder="${pw === "" || pw === null ? (e.bw ? "0" : "–") : esc(pw)}" aria-label="${esc(e.n)} set ${i+1} weight"><em>${e.bw ? "+kg" : "kg"}</em></label>
        <label class="field"><input inputmode="numeric" data-k="r" value="${esc(s.r)}" placeholder="${pr === "" ? (e.max ? "max" : e.lo) : esc(pr)}" aria-label="${esc(e.n)} set ${i+1} ${e.unit || "reps"}"><em>${e.unit === "rounds" ? "rnd" : "reps"}</em></label>
        <button class="check" data-act="done" aria-pressed="${s.d}" aria-label="Mark set ${i+1} done">✓</button>
      </div>`;
    });
    h += `<button class="addset" data-act="add">+ Add set</button></section>`;
  });
  h += `<button class="finish" id="finish">Save ${PLAN[day].name} workout</button>
    <p class="note">Empty boxes copy last session's numbers when you tick a set.</p>`;
  $("main").innerHTML = h;
}

function fmtDate(iso){
  const d = new Date(iso);
  return d.toLocaleDateString(undefined, {weekday:"short", day:"numeric", month:"short"});
}
function renderHist(){
  let h = '<div class="hist"><h2>History</h2>';
  if(!state.sessions.length){
    h += '<div class="empty">Save your first workout and it shows up here.</div></div>';
    $("main").innerHTML = h; return;
  }
  const all = Object.values(PLAN).flatMap(p => p.ex);
  [...state.sessions].reverse().forEach(s => {
    h += `<article class="sess"><div class="sesstop"><span class="sessday">${PLAN[s.day].name}</span><span class="sessdate">${fmtDate(s.date)}</span></div><ul>`;
    for(const [id, sets] of Object.entries(s.ex)){
      const e = all.find(x => x.id === id); if(!e) continue;
      const w = sets[0].w;
      const wTxt = w ? (e.bw ? "+" + w : w) + " kg × " : "";
      h += `<li><b>${esc(e.n)}</b><span>${wTxt}${sets.map(x => x.r).join(", ")}</span></li>`;
    }
    h += `</ul><button class="del" data-del="${s.id}">Delete this workout</button></article>`;
  });
  h += "</div>";
  $("main").innerHTML = h;
}
function render(){
  $("tabLog").setAttribute("aria-pressed", view === "log");
  $("tabHist").setAttribute("aria-pressed", view === "hist");
  view === "log" ? renderLog() : renderHist();
}

/* events */
$("main").addEventListener("input", ev => {
  const inp = ev.target.closest("input"); if(!inp) return;
  const ex = inp.closest(".ex").dataset.ex, i = +inp.closest(".setrow").dataset.i;
  state.draft[state.day][ex][i][inp.dataset.k] = inp.value;
  save();
});
$("main").addEventListener("click", ev => {
  const dayBtn = ev.target.closest(".day");
  if(dayBtn){ state.day = dayBtn.dataset.day; save(); render(); window.scrollTo(0,0); return; }

  const del = ev.target.closest("[data-del]");
  if(del){
    if(confirm("Delete this workout from your history?")){
      state.sessions = state.sessions.filter(s => s.id !== del.dataset.del); save(); render(); toast("Workout deleted");
    }
    return;
  }
  if(ev.target.id === "finish"){ finish(); return; }

  const act = ev.target.closest("[data-act]"); if(!act) return;
  const card = act.closest(".ex"), exId = card.dataset.ex;
  const sets = state.draft[state.day][exId];
  if(act.dataset.act === "add"){
    sets.push({w: sets.length ? sets[sets.length-1].w : "", r:"", d:false}); save(); renderLog(); return;
  }
  if(act.dataset.act === "done"){
    const row = act.closest(".setrow"), i = +row.dataset.i, s = sets[i];
    s.d = !s.d;
    if(s.d){
      const wIn = row.querySelector('[data-k="w"]'), rIn = row.querySelector('[data-k="r"]');
      if(s.w === "" && wIn.placeholder !== "–" && wIn.placeholder !== "0") s.w = wIn.placeholder;
      if(s.r === "" && !isNaN(parseInt(rIn.placeholder))) s.r = rIn.placeholder;
      startTimer();
    }
    save(); renderLog();
  }
});

function finish(){
  const day = state.day, d = state.draft[day], ex = {};
  for(const [id, sets] of Object.entries(d)){
    const good = sets.map(s => ({w:num(s.w), r:parseInt(s.r)})).filter(s => s.r > 0);
    if(good.length) ex[id] = good;
  }
  if(!Object.keys(ex).length){ toast("Log at least one set with reps first"); return; }
  state.sessions.push({id: Date.now().toString(36), day, date:new Date().toISOString(), ex});
  delete state.draft[day];
  const order = ["push","pull","legs"];
  state.day = order[(order.indexOf(day) + 1) % 3];
  save(); stopTimer(); view = "hist"; render(); window.scrollTo(0,0);
  toast(PLAN[day].name + " workout saved");
}

/* rest timer */
let tEnd = 0, tInt = null, buzzed = false;
function startTimer(){ tEnd = Date.now() + state.rest * 1000; buzzed = false; $("timer").classList.add("on"); tick(); clearInterval(tInt); tInt = setInterval(tick, 250); }
function stopTimer(){ clearInterval(tInt); $("timer").classList.remove("on","over"); }
function tick(){
  const left = Math.round((tEnd - Date.now()) / 1000), a = Math.abs(left);
  $("tclock").textContent = (left < 0 ? "+" : "") + Math.floor(a/60) + ":" + String(a%60).padStart(2,"0");
  $("tlabel").textContent = left > 0 ? "Rest" : "Next set";
  $("timer").classList.toggle("over", left <= 0);
  if(left <= 0 && !buzzed){ buzzed = true; try{ navigator.vibrate && navigator.vibrate([200,100,200]); }catch(e){} }
}
$("tminus").onclick = () => { tEnd -= 15000; tick(); };
$("tplus").onclick = () => { tEnd += 15000; tick(); };
$("tskip").onclick = stopTimer;

/* tabs, settings, toast */
$("tabLog").onclick = () => { view = "log"; render(); };
$("tabHist").onclick = () => { view = "hist"; render(); };
function renderRest(){
  $("restpick").innerHTML = [60,90,120,180].map(s =>
    `<button class="ghost" data-rest="${s}" aria-pressed="${state.rest===s}">${s<120 ? s + " s" : s/60 + " min"}</button>`).join("");
}
$("restpick").addEventListener("click", ev => {
  const b = ev.target.closest("[data-rest]"); if(!b) return;
  state.rest = +b.dataset.rest; save(); renderRest();
});
$("openHelp").onclick = () => { renderRest(); $("sheet").classList.add("on"); };
$("closeHelp").onclick = () => $("sheet").classList.remove("on");
$("sheet").onclick = ev => { if(ev.target.id === "sheet") $("sheet").classList.remove("on"); };
let toastT;
function toast(msg){ const t = $("toast"); t.textContent = msg; t.classList.add("on"); clearTimeout(toastT); toastT = setTimeout(() => t.classList.remove("on"), 2200); }

render();
if("serviceWorker" in navigator){ window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {})); }
</script>
</body>
</html>
